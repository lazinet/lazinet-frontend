<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3A8F">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Hồ sơ đề xuất · ATL x LAZINET</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B3A8F'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='13' font-weight='bold' fill='%23fff' text-anchor='middle'%3EATL%3C/text%3E%3C/svg%3E">
<style>/* ===========================================================================
   ATL x LAZINET - Hồ sơ đề xuất.
   Ngôn ngữ thị giác của tài liệu tư vấn tài chính: cột sống navy, số liệu đẳng
   chiều cỡ lớn, đường kẻ thay cho đổ bóng, không bo tròn, mật độ cao nhưng có
   nhịp. Bảng màu rút từ logo ATL hiện hữu.
   =========================================================================== */
:root{
  color-scheme: light;
  --navy:#0B3A8F; --navy-d:#072A6B; --navy-x:#04163C; --navy-l:#1B4FA8;
  --blue:#1F6FD0; --blue-d:#1559AE; --blue-l:#5B9BE5;
  --sky:#EEF4FC; --sky-2:#DCE8F8; --sky-3:#C2D6F0;
  --red:#C8102E; --red-bg:#FCEDEF; --red-l:#E8616F;
  --amber:#B07A10; --amber-bg:#FDF5E6; --amber-l:#E0A63C;
  --green:#12694A; --green-bg:#E7F3EE; --green-l:#3FA37C;
  --orange:#E05A00;
  --ink:#0C121C; --ink-2:#263040; --soft:#495567; --mute:#6E7A8C; --faint:#97A2B2;
  --line:#D6DEE9; --line-2:#E7ECF3; --line-3:#F2F5F9;
  --bg:#FFFFFF; --bg-alt:#F7F9FC; --bg-deep:#EDF1F7;
  --nav-w:252px;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --fm:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --s1:clamp(26px,5.2vw,40px);
  --s2:clamp(20px,3.4vw,27px);
  --s3:clamp(16px,2.1vw,19px);
  --tx:clamp(14.5px,1.45vw,15.8px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
  font-size:var(--tx);line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;height:auto;display:block}
a{color:var(--blue-d);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.2;letter-spacing:-.018em;color:var(--ink)}
p{margin:0 0 .72em}
ul,ol{margin:0 0 1em;padding-left:1.15em}
li{margin-bottom:.32em}
b,strong{font-weight:650}
table{border-collapse:collapse;width:100%}
code{font-family:var(--fm);font-size:.88em;background:var(--sky);padding:1px 5px;color:var(--navy)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ---------------------------------------------------------- cổng mật khẩu */
.gate{position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:20px;
  background:linear-gradient(155deg,var(--navy) 0%,var(--navy-d) 55%,var(--navy-x) 100%)}
.gate-card{background:#fff;width:100%;max-width:410px;padding:30px 28px;border:1px solid rgba(0,0,0,.08)}
.gate-logo{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.gate-logo img{height:40px;width:auto}
.gate-logo span{font-size:12.5px;color:var(--mute);line-height:1.35}
.gate-logo b{display:block;font-size:15px;color:var(--navy)}
.gate h1{font-size:20px;color:var(--navy);margin-bottom:7px}
.gate p{font-size:13.5px;color:var(--soft);margin-bottom:18px}
.gate label{display:block;font-size:12.5px;font-weight:650;color:var(--soft);margin-bottom:6px}
.gate input{width:100%;padding:12px 14px;border:1px solid var(--line);font-family:inherit;font-size:16px;color:var(--ink)}
.gate input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.gate button{width:100%;margin-top:14px;padding:13px;background:var(--navy);color:#fff;border:0;
  font:650 15px var(--f);cursor:pointer}
.gate button:hover{background:var(--navy-l)}
.gate button:disabled{opacity:.6;cursor:not-allowed}
.gate-err{color:var(--red);font-size:13px;min-height:19px;margin-top:10px}
.gate-foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.5}

/* ---------------------------------------------------------- khung */
.app{display:block}
.topbar{position:sticky;top:0;z-index:70;background:var(--navy);color:#fff}
.topbar-in{display:flex;align-items:center;gap:11px;padding:9px 14px}
.tb-mark{width:30px;height:30px;background:#fff;color:var(--navy);display:grid;place-items:center;
  font-weight:800;font-size:10px;flex:0 0 auto;letter-spacing:.02em}
.tb-t{flex:1;min-width:0;font-size:13.5px;font-weight:650;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-t i{display:block;font-style:normal;font-weight:400;font-size:11px;color:#9FC0EC}
.tb-btn{background:rgba(255,255,255,.14);border:0;color:#fff;width:36px;height:34px;cursor:pointer;
  display:grid;place-items:center;flex:0 0 auto;padding:0}
.tb-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.prog{height:3px;background:rgba(255,255,255,.18)}
.prog i{display:block;height:100%;background:var(--orange);width:0}

.shell{display:block}
.nav{position:fixed;inset:0 auto 0 0;width:var(--nav-w);background:var(--navy-x);color:#B9CDE8;
  z-index:90;transform:translateX(-100%);transition:transform .2s ease;display:flex;flex-direction:column}
.nav.open{transform:none}
.nav-brand{padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.1);flex:0 0 auto}
.nav-brand b{display:block;color:#fff;font-size:14px;letter-spacing:.01em}
.nav-brand span{font-size:11.5px;color:#7E9CC8}
.nav-list{flex:1;overflow-y:auto;padding:8px 0}
.nav-list a{display:flex;gap:11px;padding:8px 18px;color:#B9CDE8;font-size:13.2px;line-height:1.35;
  border-left:3px solid transparent}
.nav-list a:hover{background:rgba(255,255,255,.06);color:#fff;text-decoration:none}
.nav-list a.on{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--orange);font-weight:600}
.nav-list a em{font-style:normal;font-variant-numeric:tabular-nums;color:#6B8AB8;font-size:11.5px;
  min-width:17px;padding-top:2px}
.nav-list a.on em{color:var(--orange)}
.nav-foot{padding:13px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#7E9CC8;flex:0 0 auto}
.scrim{position:fixed;inset:0;background:rgba(4,22,60,.55);z-index:85;display:none}
.scrim.on{display:block}

main{min-width:0}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}

/* ---------------------------------------------------------- bìa */
.cover{background:linear-gradient(158deg,var(--navy) 0%,var(--navy-d) 52%,var(--navy-x) 100%);
  color:#fff;padding:34px 0 0;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;right:-240px;top:-200px;width:620px;height:620px;
  border:1px solid rgba(255,255,255,.07);transform:rotate(45deg);
  box-shadow:inset 0 0 0 60px rgba(255,255,255,.025)}
.cover .wrap{position:relative;z-index:1}
.cv-logos{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.cv-logos img{height:40px;width:auto;background:#fff;padding:5px 9px}
.cv-logos .x{color:#7E9CC8;font-size:15px}
.cv-mark{background:#fff;padding:8px 12px;font:800 16px/1 var(--f);letter-spacing:.01em}
.cv-mark b{color:var(--orange)}.cv-mark i{color:#1A1AC8;font-style:normal}
.cv-k{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#8CB2E6;font-weight:700}
.cover h1{font-size:var(--s1);margin:12px 0 14px;color:#fff;letter-spacing:-.028em;line-height:1.12;max-width:17ch}
.cover h1 em{font-style:normal;color:#FFB36B}
.cv-lead{font-size:clamp(15px,1.8vw,17.5px);color:#C5D9F2;max-width:62ch;margin-bottom:24px}
.cv-meta{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:12.5px;color:#9FC0EC;
  border-top:1px solid rgba(255,255,255,.16);padding-top:16px;margin-bottom:28px}
.cv-meta b{color:#fff;font-weight:600}
.cv-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(255,255,255,.16);
  margin:0 -18px;border-top:1px solid rgba(255,255,255,.16)}
.cv-stats div{background:var(--navy-d);padding:16px 18px}
.cv-stats b{display:block;font-size:clamp(23px,4vw,31px);font-weight:750;letter-spacing:-.03em;
  line-height:1.08;font-variant-numeric:tabular-nums}
.cv-stats b small{font-size:.5em;font-weight:600;letter-spacing:0}
.cv-stats span{display:block;font-size:12px;color:#9FC0EC;margin-top:5px;line-height:1.4}

/* ---------------------------------------------------------- mục */
section{padding:38px 0;border-bottom:1px solid var(--line-2);scroll-margin-top:60px}
section.alt{background:var(--bg-alt)}
section.deep{background:var(--bg-deep)}
.sec-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.sec-n{flex:0 0 auto;width:40px;height:40px;background:var(--navy);color:#fff;display:grid;place-items:center;
  font:750 15px/1 var(--f);font-variant-numeric:tabular-nums}
.sec-h h2{font-size:var(--s2);color:var(--navy);margin-bottom:6px}
.sec-h p{font-size:clamp(14px,1.55vw,16px);color:var(--soft);margin:0;max-width:74ch}
.sec-sub{font-size:var(--s3);color:var(--navy);margin:30px 0 13px;padding-bottom:8px;border-bottom:2px solid var(--sky-2)}

.lede{font-size:clamp(15px,1.75vw,17px);color:var(--ink-2);max-width:72ch;margin-bottom:20px}
.note{border-left:3px solid var(--navy);background:var(--sky);padding:13px 16px;font-size:14.5px;
  color:var(--navy);margin:18px 0}
.note.w{border-color:var(--amber);background:var(--amber-bg);color:#7A5208}
.note.g{border-color:var(--green);background:var(--green-bg);color:#0C4F36}
.note.r{border-color:var(--red);background:var(--red-bg);color:#8A0B20}
.note.n{border-color:var(--line);background:#fff;color:var(--soft)}
.note b{font-weight:700}

/* ---------------------------------------------------------- lưới thẻ */
.g2,.g3,.g4{display:grid;gap:12px;grid-template-columns:1fr}
.card{background:#fff;border:1px solid var(--line);padding:17px 18px;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--navy)}
.card.r::before{background:var(--red)}.card.b::before{background:var(--blue)}
.card.g::before{background:var(--green)}.card.a::before{background:var(--amber)}
.card.o::before{background:var(--orange)}.card.n::before{background:var(--line)}
.card .k{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--blue)}
.card.r .k{color:var(--red)}.card.g .k{color:var(--green)}
.card.a .k{color:var(--amber)}.card.o .k{color:var(--orange)}
.card h3{font-size:16px;margin:6px 0 8px;color:var(--navy)}
.card p{font-size:14px;color:var(--soft);margin:0}
.card ul{margin:8px 0 0;padding-left:1em;font-size:13.8px;color:var(--soft)}
.card li{margin-bottom:4px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.stats div{background:#fff;padding:14px 15px}
.stats b{display:block;font-size:clamp(21px,3.4vw,27px);font-weight:750;color:var(--navy);
  letter-spacing:-.028em;line-height:1.12;font-variant-numeric:tabular-nums}
.stats b small{font-size:.52em;font-weight:600;color:var(--soft);letter-spacing:0}
.stats b.red{color:var(--red)}.stats b.green{color:var(--green)}
.stats span{display:block;font-size:12px;color:var(--mute);margin-top:4px;line-height:1.4}

/* ---------------------------------------------------------- bảng */
.tw{border:1px solid var(--line);background:#fff}
.tbl{font-size:13.8px}
.tbl th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-size:12px;
  font-weight:600;vertical-align:middle;line-height:1.3}
.tbl td{padding:10px 12px;border-top:1px solid var(--line-2);vertical-align:top}
.tbl tbody tr:nth-child(even) td{background:#FBFCFE}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.c,.tbl th.c{text-align:center}
.tbl td.nw,.tbl th.nw{white-space:nowrap}
.tbl .sub{display:block;color:var(--mute);font-size:12.5px;margin-top:3px;line-height:1.45}
.tbl tr.hl td{background:var(--sky) !important;font-weight:650}
.scroll-note{font-size:12px;color:var(--mute);margin-top:7px}
.tag{display:inline-block;padding:2px 8px;font-size:11px;font-weight:650;white-space:nowrap;line-height:1.5}
.t-r{background:var(--red-bg);color:var(--red)}
.t-a{background:var(--amber-bg);color:var(--amber)}
.t-g{background:var(--green-bg);color:var(--green)}
.t-b{background:var(--sky);color:var(--navy)}
.t-n{background:#EEF1F6;color:var(--mute)}
.t-o{background:#FFF0E4;color:var(--orange)}

/* bảng chuyển thành thẻ trên màn hình hẹp */
@media (max-width:719px){
  .tbl.cardify thead{display:none}
  .tbl.cardify tbody tr{display:block;border:1px solid var(--line);margin-bottom:9px;background:#fff}
  .tbl.cardify tbody tr:nth-child(even) td{background:transparent}
  .tbl.cardify td{display:flex;gap:12px;border-top:1px solid var(--line-3);padding:8px 12px;text-align:left !important}
  .tbl.cardify tr td:first-child{border-top:0;background:var(--sky) !important;font-weight:650;color:var(--navy)}
  .tbl.cardify td::before{content:attr(data-l);flex:0 0 36%;color:var(--mute);font-size:12px;font-weight:600}
  .tbl.cardify tr td:first-child::before{color:var(--navy)}
  .tw.cardwrap{border:0;background:transparent}
}

/* ---------------------------------------------------------- biểu đồ */
.fig{background:#fff;border:1px solid var(--line);padding:16px 18px;margin:16px 0}
.fig-h{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.fig-h b{font-size:14.5px;color:var(--navy)}
.fig-h span{font-size:12px;color:var(--mute)}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig-cap{font-size:12.3px;color:var(--mute);margin-top:12px;padding-top:10px;border-top:1px solid var(--line-2);line-height:1.5}
.legend{display:flex;gap:7px 18px;flex-wrap:wrap;margin-top:12px;font-size:12.3px;color:var(--soft)}
.legend i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px}

/* đối chiếu hai con số */
.vs{display:grid;grid-template-columns:1fr;gap:12px;margin:18px 0}
.vs>div{padding:18px 19px;border:1px solid}
.vs .a{background:var(--red-bg);border-color:var(--red)}
.vs .b{background:var(--green-bg);border-color:var(--green)}
.vs .k{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
.vs .a .k{color:var(--red)}.vs .b .k{color:var(--green)}
.vs .big{font-size:clamp(28px,5.5vw,40px);font-weight:750;letter-spacing:-.035em;margin:5px 0 10px;line-height:1;
  font-variant-numeric:tabular-nums}
.vs .a .big{color:var(--red)}.vs .b .big{color:var(--green)}
.vs p{font-size:13.6px;color:var(--soft);margin:0 0 .4em}
.vs p.hi{color:var(--ink);font-weight:650;margin:0}

/* ---------------------------------------------------------- quy trình */
.flow{border:1px solid var(--line);background:#fff}
.flow-r{display:flex;align-items:stretch;border-bottom:1px solid var(--line-2)}
.flow-r:last-child{border-bottom:0}
.flow-n{flex:0 0 34px;display:grid;place-items:center;font:700 12px/1 var(--f);color:#fff;background:var(--green)}
.flow-r.man .flow-n{background:var(--blue)}
.flow-d{flex:1;padding:10px 13px;font-size:13.6px;min-width:0}
.flow-w{flex:0 0 112px;padding:10px 13px 10px 0;font-size:11.8px;font-weight:650;color:var(--green);text-align:right}
.flow-r.man .flow-w{color:var(--blue)}
.flow-r.auto{background:#F7FCF9}.flow-r.man{background:#F6FAFE}
@media(max-width:559px){.flow-w{display:none}.flow-d{padding-right:13px}}

/* ---------------------------------------------------------- phân hệ */
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mod{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);padding:11px 12px}
.mod.r{border-top-color:var(--red)}.mod.b{border-top-color:var(--blue)}
.mod.g{border-top-color:var(--green)}.mod.a{border-top-color:var(--amber)}
.mod.o{border-top-color:var(--orange)}.mod.n{border-top-color:#94A3B8}
.mod code{font-family:var(--fm);font-size:11.5px;font-weight:700;color:var(--navy);background:none;padding:0}
.mod.r code{color:var(--red)}.mod.o code{color:var(--orange)}
.mod.g code{color:var(--green)}.mod.a code{color:var(--amber)}
.mod b{display:block;font-size:12.6px;font-weight:600;margin:3px 0 2px;line-height:1.3}
.mod span{font-size:11px;color:var(--mute)}

/* ---------------------------------------------------------- kiến trúc */
.arch{border:1px solid var(--line);background:#fff;padding:16px}
.arch-row{margin-bottom:12px}
.arch-row:last-child{margin-bottom:0}
.arch-k{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
.arch-g{display:grid;gap:8px;grid-template-columns:1fr}
.arch-b{border:1px solid var(--line);padding:11px 13px;background:var(--bg-alt)}
.arch-b b{display:block;font-size:13.8px;color:var(--navy);margin-bottom:3px}
.arch-b span{font-size:12.5px;color:var(--soft);line-height:1.5}
.arch-core{background:var(--navy);color:#fff;padding:13px 15px}
.arch-core b{display:block;font-size:14.5px}
.arch-core span{font-size:12.8px;color:#B9CDE8}

/* ---------------------------------------------------------- lộ trình */
.phase{background:#fff;border:1px solid var(--line);margin-bottom:12px}
.phase-h{padding:12px 15px;color:#fff;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.phase.p1 .phase-h{background:var(--red)}
.phase.p2 .phase-h{background:var(--blue)}
.phase.p3 .phase-h{background:var(--green)}
.phase-h b{font-size:15px}
.phase-h span{font-size:12.3px;opacity:.92}
.phase-b{padding:13px 15px}
.phase-b ul{margin:0;padding-left:1em;font-size:13.6px;color:var(--ink-2)}
.phase-out{margin:0 15px 14px;padding:9px 12px;background:var(--bg-alt);font-size:12.8px;font-weight:650}
.phase.p1 .phase-out{color:var(--red)}
.phase.p2 .phase-out{color:var(--blue)}
.phase.p3 .phase-out{color:var(--green)}

/* ---------------------------------------------------------- đầu tư */
.deal{border:1px solid var(--line);background:#fff;margin-bottom:16px}
.deal-h{padding:14px 17px;border-bottom:1px solid var(--line)}
.deal.m1 .deal-h{background:var(--sky)}
.deal.m2 .deal-h{background:var(--green-bg)}
.deal-h b{display:block;font-size:17px;color:var(--navy)}
.deal.m2 .deal-h b{color:var(--green)}
.deal-h span{font-size:13.5px;color:var(--soft)}
.deal-b{padding:16px 17px}
.price{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px}
.price>div{border:1px solid var(--line);padding:13px 14px;background:var(--bg-alt)}
.price .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.price .v{font-size:clamp(19px,3vw,24px);font-weight:750;color:var(--navy);letter-spacing:-.025em;
  margin:3px 0 5px;font-variant-numeric:tabular-nums;line-height:1.12}
.price .v small{font-size:.55em;font-weight:600;color:var(--soft)}
.deal.m2 .price .v{color:var(--green)}
.price p{font-size:12.5px;color:var(--soft);margin:0;line-height:1.5}

/* ---------------------------------------------------------- bản chạy thử */
.demo{background:var(--navy);color:#fff;padding:22px 20px;margin:20px 0}
.demo h3{color:#fff;font-size:18px;margin-bottom:7px}
.demo>p{color:#C5D9F2;font-size:14.3px;max-width:68ch}
.demo-links{display:grid;gap:11px;grid-template-columns:1fr;margin-top:18px}
.demo-link{display:block;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);
  padding:15px 17px;color:#fff}
.demo-link:hover{background:rgba(255,255,255,.17);text-decoration:none;color:#fff}
.demo-link .k{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--amber-l);font-weight:700}
.demo-link b{display:block;font-size:16px;margin:5px 0 5px}
.demo-link code{display:block;background:none;padding:0;color:#9FC0EC;font-size:12.5px;word-break:break-all;margin-bottom:8px}
.demo-link span{display:block;font-size:12.8px;color:#C5D9F2;line-height:1.5}
.demo-acc{margin-top:16px;padding-top:15px;border-top:1px solid rgba(255,255,255,.18);font-size:12.5px;color:#9FC0EC}
.demo-acc b{color:#fff}
.demo-acc table{margin-top:8px;font-size:12.3px}
.demo-acc td{padding:3px 12px 3px 0;color:#C5D9F2}
.demo-acc td:first-child{font-family:var(--fm);color:#fff;white-space:nowrap}

/* ---------------------------------------------------------- chân trang */
footer{background:var(--navy-x);color:#9FC0EC;padding:30px 0 26px;font-size:13.5px}
footer .wrap>p{margin-bottom:9px;line-height:1.6}
footer b{color:#fff}
.ft-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:16px;
  border-bottom:1px solid rgba(255,255,255,.14);flex-wrap:wrap}
.ft-brand img{height:36px;background:#fff;padding:4px 7px}
.ft-note{margin-top:18px;padding-top:15px;border-top:1px solid rgba(255,255,255,.14);font-size:12px;color:#7E9CC8;line-height:1.55}

/* ---------------------------------------------------------- màn hình lớn */
@media (min-width:560px){
  .g2{grid-template-columns:1fr 1fr}
  .price{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(4,1fr)}
  .cv-stats{grid-template-columns:repeat(4,1fr)}
  .arch-g{grid-template-columns:1fr 1fr}
  .mods{grid-template-columns:repeat(3,1fr)}
  .demo-links{grid-template-columns:1fr 1fr}
}
@media (min-width:720px){
  .wrap{padding:0 24px}
  section{padding:52px 0}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)}
  .vs{grid-template-columns:1fr 1fr}
  .cover{padding-top:50px}
  .cv-stats{margin:0 -24px}
  .mods{grid-template-columns:repeat(4,1fr)}
  .arch-g{grid-template-columns:repeat(4,1fr)}
  .arch-g.g3c{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:1100px){
  .topbar{display:none}
  .nav{transform:none}
  .scrim{display:none !important}
  main{margin-left:var(--nav-w)}
  .wrap{max-width:1000px;padding:0 40px}
  .cv-stats{margin:0 -40px}
  .g4{grid-template-columns:repeat(4,1fr)}
  section{padding:60px 0}
}
@media print{
  .nav,.topbar,.gate,.cbot-fab,.cbot{display:none !important}
  main{margin:0}
  section{page-break-inside:avoid;padding:14pt 0;border:0}
  body{font-size:10.5pt}
  .cover{background:#fff;color:#000}
  .cover h1,.cv-stats b{color:#000}
}

/* ---------------------------------------------------------- trục thời gian chính sách */
/* Dựng bằng HTML chứ không phải SVG: chữ trong SVG không tự xuống dòng nên rất
   dễ chồng nhau khi khung hẹp. Bản này xếp dọc trên điện thoại và nằm ngang
   trên màn rộng, chữ luôn có chỗ. */
.tlwrap .tl{list-style:none;margin:0;padding:0;position:relative}
.tl-i{position:relative;padding:0 0 20px 26px;border-left:2px solid var(--line)}
.tl-i:last-child{padding-bottom:0;border-left-color:transparent}
.tl-dot{position:absolute;left:-7px;top:4px;width:12px;height:12px;background:var(--navy)}
.tl-i.r .tl-dot{background:var(--red)}
.tl-i.a .tl-dot{background:var(--amber)}
.tl-i.b .tl-dot{background:var(--blue)}
.tl-i time{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--navy);
  font-variant-numeric:tabular-nums;margin-bottom:2px}
.tl-i.r time{color:var(--red)}.tl-i.a time{color:var(--amber)}.tl-i.b time{color:var(--blue)}
.tl-i b{display:block;font-size:15px;color:var(--ink);margin-bottom:3px;line-height:1.3}
.tl-i span{display:block;font-size:13.3px;color:var(--soft);line-height:1.52}

@media (min-width:860px){
  .tlwrap .tl{display:grid;grid-template-columns:repeat(5,1fr);gap:0 14px;padding-top:26px}
  .tlwrap .tl::before{content:"";position:absolute;left:0;right:0;top:31px;height:2px;background:var(--line)}
  .tl-i{padding:22px 0 0;border-left:0}
  .tl-i:last-child{border-left:0}
  .tl-dot{left:0;top:-6px;width:13px;height:13px;outline:4px solid #fff}
  .tl-i b{font-size:14.5px}
  .tl-i span{font-size:12.6px}
}

/* ---------------------------------------------------------- màn hình chờ */
/* Man hinh cho. Logo la tep nhan dien goc nhung nguyen tung byte duoi dang
   data URI, o day chi dat kich thuoc. Ban goc ve cac vong tron mau trang nen
   nen man hinh cho phai sang, khong duoc de nen toi. */
.boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 0%,#FFFFFF 0%,#F4F7FC 52%,#E8EEF7 100%)}
.boot.out{animation:bootout .35s ease forwards;pointer-events:none}
@keyframes bootout{to{opacity:0;visibility:hidden}}
.boot-in{width:min(392px,84vw);text-align:center}
.boot-logo{display:block;width:100%;height:auto;max-width:392px;margin:0 auto 22px}
.boot-bar{height:3px;background:#D3DCE8;overflow:hidden;position:relative}
.boot-bar i{position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--orange);
  animation:bootslide 1.15s cubic-bezier(.65,.05,.36,1) infinite}
@keyframes bootslide{0%{left:-32%;width:32%}50%{width:48%}100%{left:100%;width:32%}}
.boot-bar.determinate i{animation:none;left:0;transition:width .25s ease}
.boot-t{margin-top:13px;font-size:12.5px;font-weight:600;color:var(--navy);letter-spacing:.03em;min-height:19px}
.boot-sub{margin-top:3px;font-size:11px;color:var(--mute);letter-spacing:.02em}

/* logo trong cổng mật khẩu */
.gate-logo{align-items:center}
.gate-logo .gx{color:var(--faint);font-size:15px}
.gate-lz{width:118px;height:auto;flex:0 0 auto}

/* hai tài liệu tải về, đặt ngay dưới khối xem thử */
.dls{display:grid;gap:11px;grid-template-columns:1fr;margin:16px 0 18px}
.dl{display:flex;gap:14px;align-items:flex-start;padding:15px 16px;background:var(--bg-alt);
  border:1px solid var(--line);border-left:3px solid var(--navy);color:var(--ink)}
.dl:hover{background:var(--sky);border-color:var(--navy);border-left-color:var(--red);text-decoration:none}
.dl-x{flex:0 0 auto;padding:6px 9px;background:var(--navy);color:#fff;font-size:11px;font-weight:700;
  letter-spacing:.09em;font-family:var(--fm)}
.dl:hover .dl-x{background:var(--red)}
.dl-b{display:block;min-width:0}
.dl-b b{display:block;font-size:15.5px;color:var(--navy);line-height:1.3}
.dl-b i{display:block;font-style:normal;margin-top:4px;font-size:13.2px;color:var(--soft);line-height:1.52}
.dl-b em{display:block;font-style:normal;margin-top:7px;font-size:11.8px;color:var(--mute);
  font-family:var(--fm);word-break:break-all}
@media (min-width:720px){ .dls{grid-template-columns:1fr 1fr} }

.cbot-fab{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;align-items:center;gap:9px;
  background:var(--navy);color:#fff;border:0;padding:12px 17px;font:650 14px/1 var(--f);cursor:pointer;
  box-shadow:0 8px 26px rgba(10,30,70,.3)}
.cbot-fab:hover{background:var(--blue)}
.cbot-fab i{width:8px;height:8px;background:#5CE08A;display:block;flex:0 0 auto}
.cbot-fab.hide{display:none}
.cbot{position:fixed;inset:0;z-index:310;background:rgba(8,22,55,.45);display:none}
.cbot.open{display:block}
.cbot-panel{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column}
.cbot-head{background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.cbot-head b{flex:1;font-size:14.5px;font-weight:650;line-height:1.25}
.cbot-head b span{display:block;font-weight:400;font-size:11.5px;color:#9FC0EC}
.cbot-head button{background:rgba(255,255,255,.16);border:0;color:#fff;width:32px;height:32px;
  font-size:19px;cursor:pointer;line-height:1;flex:0 0 auto}
.cbot-body{flex:1;overflow-y:auto;padding:14px;background:var(--bg-alt);-webkit-overflow-scrolling:touch}
.cbot-msg{margin-bottom:12px;font-size:13.8px;line-height:1.6;white-space:pre-wrap}
.cbot-msg.me{background:var(--navy);color:#fff;padding:10px 13px;margin-left:auto;max-width:86%;width:fit-content}
.cbot-msg.ai{background:#fff;border:1px solid var(--line);padding:12px 14px;color:var(--ink)}
.cbot-msg.ai b{color:var(--navy)}
.cbot-src{margin-top:10px;padding-top:9px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--mute);white-space:normal}
.cbot-src b{display:block;color:var(--soft);margin-bottom:3px;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.cbot-badge{display:inline-block;padding:2px 7px;font-size:10.5px;font-weight:650;margin-top:8px;
  background:var(--amber-bg);color:var(--amber)}
.cbot-sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cbot-sugg button{background:#fff;border:1px solid var(--line);padding:7px 11px;
  font:400 12.5px/1.35 var(--f);color:var(--soft);cursor:pointer;text-align:left}
.cbot-sugg button:hover{border-color:var(--blue);color:var(--navy)}
.cbot-foot{flex:0 0 auto;border-top:1px solid var(--line);background:#fff;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.cbot-row{display:flex;gap:8px}
.cbot-row input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);font:400 15px var(--f);color:var(--ink)}
.cbot-row input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.cbot-row button{background:var(--navy);color:#fff;border:0;padding:0 18px;font:650 14px var(--f);cursor:pointer}
.cbot-row button:disabled{opacity:.5;cursor:not-allowed}
.cbot-note{font-size:10.5px;color:var(--mute);margin-top:7px;line-height:1.4}
.cbot-dots span{display:inline-block;width:6px;height:6px;background:var(--blue);margin-right:4px;animation:cbd 1s infinite}
.cbot-dots span:nth-child(2){animation-delay:.15s}.cbot-dots span:nth-child(3){animation-delay:.3s}
@keyframes cbd{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media(min-width:720px){.cbot{background:transparent;inset:auto;right:16px;bottom:16px;width:430px;height:min(660px,82vh)}
.cbot-panel{border:1px solid var(--line);box-shadow:0 18px 50px rgba(8,22,55,.3)}}
</style>
</head>

<script>/* ===========================================================================
   Phần chạy của hồ sơ đề xuất: mở khóa nội dung, điều hướng, theo dõi vị trí
   đọc và bong bóng trò chuyện.

   Nội dung hồ sơ được mã hóa bằng AES-GCM với khóa dẫn xuất từ mật khẩu, nên
   không nhập đúng mật khẩu thì xem mã nguồn cũng không đọc được gì. Đây là
   khóa thật chứ không phải lớp che mắt.
   =========================================================================== */
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };

  // ---------------------------------------------------------- màn hình chờ
  // Logo o cong mat khau dung lai dung mot ban da nhung o man hinh cho,
  // de tep khong phai chua hai lan cung mot anh 40 KB.
  (function () {
    var a = document.querySelector(".boot-logo"), b = document.getElementById("gate-lz");
    if (a && b) b.src = a.getAttribute("src");
  })();

  var boot = {
    el: function () { return $("#boot"); },
    say: function (t, pct) {
      var b = this.el(); if (!b) return;
      var tx = $("#boot-t"); if (tx) tx.textContent = t;
      var bar = $("#boot-bar");
      if (bar && typeof pct === "number") {
        bar.classList.add("determinate");
        bar.firstElementChild.style.width = pct + "%";
      }
    },
    show: function (t) {
      var b = this.el(); if (!b) return;
      b.classList.remove("out", "hide");
      if (t) this.say(t);
    },
    hide: function () {
      var b = this.el(); if (!b) return;
      b.classList.add("out");
      setTimeout(function () { if (b.parentNode) b.remove(); }, 420);
    },
  };

  // ---------------------------------------------------------- mở khóa
  async function unlock(pw) {
    var P = window.__PAYLOAD;
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(P.s), iterations: P.i, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.v) }, key, b64(P.d));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  var form = $("#gate-form");
  var inp = $("#gate-pw");
  var err = $("#gate-err");
  var btn = $("#gate-btn");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    btn.disabled = true; btn.textContent = "Đang mở...";
    err.textContent = "";
    var pw = inp.value;
    $("#gate").classList.add("hide");
    boot.show("Đang giải mã hồ sơ");
    boot.say("Đang giải mã hồ sơ", 35);
    try {
      var data = await unlock(pw);
      boot.say("Đang dựng nội dung", 80);
      try { sessionStorage.setItem("atl_pw", pw); } catch (x) {}
      render(data);
    } catch (x) {
      boot.hide();
      $("#gate").classList.remove("hide");
      err.textContent = "Mật khẩu không đúng. Vui lòng kiểm tra lại.";
      inp.value = ""; inp.focus();
    } finally {
      btn.disabled = false; btn.textContent = "Mở hồ sơ";
    }
  });

  // Mở lại trong cùng phiên thì không phải nhập lại. Nếu chưa có mật khẩu lưu
  // thì tắt màn hình chờ và hiện cổng.
  (async function () {
    var saved = null;
    try { saved = sessionStorage.getItem("atl_pw"); } catch (x) {}
    if (!saved) {
      setTimeout(function () { boot.hide(); $("#gate").classList.remove("hide"); inp.focus(); }, 650);
      return;
    }
    boot.say("Đang mở hồ sơ", 40);
    try {
      var d = await unlock(saved);
      boot.say("Đang dựng nội dung", 85);
      render(d);
    } catch (x) {
      boot.hide(); $("#gate").classList.remove("hide");
    }
  })();

  // ---------------------------------------------------------- dựng trang
  function render(data) {
    window.ATL_KB = data.kb || [];
    var g = $("#gate"); if (g) g.remove();
    var app = $("#app");
    app.innerHTML = data.html;
    app.classList.remove("hide");
    document.title = data.title || document.title;
    initNav();
    initChat();
    window.scrollTo(0, 0);
    boot.say("Xong", 100);
    setTimeout(function () { boot.hide(); }, 180);
  }

  // ---------------------------------------------------------- điều hướng
  function initNav() {
    var nav = $("#nav"), scrim = $("#scrim"), burger = $("#burger"), prog = $("#prog-i");
    var links = [].slice.call(document.querySelectorAll("#nav-list a"));
    var secs = links.map(function (a) { return document.querySelector(a.getAttribute("href")); })
      .filter(Boolean);

    function close() { nav.classList.remove("open"); scrim.classList.remove("on"); }
    burger.addEventListener("click", function () {
      nav.classList.toggle("open"); scrim.classList.toggle("on");
    });
    scrim.addEventListener("click", close);
    links.forEach(function (a) { a.addEventListener("click", close); });

    var cur = null;
    function onScroll() {
      var h = document.documentElement;
      var max = h.scrollHeight - h.clientHeight;
      prog.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + "%";
      var y = h.scrollTop + 120, found = secs[0];
      for (var i = 0; i < secs.length; i++) if (secs[i].offsetTop <= y) found = secs[i];
      if (found && found.id !== cur) {
        cur = found.id;
        links.forEach(function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + cur); });
        var t = $("#tb-sec");
        var on = links.filter(function (a) { return a.classList.contains("on"); })[0];
        if (t && on) t.textContent = on.dataset.t || "";
        var act = document.querySelector("#nav-list a.on");
        if (act && nav.scrollHeight > nav.clientHeight) {
          var box = $("#nav-list");
          var top = act.offsetTop - box.clientHeight / 2;
          if (Math.abs(box.scrollTop - top) > 60) box.scrollTop = Math.max(0, top);
        }
      }
    }
    document.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  }

  // ---------------------------------------------------------- bong bóng trò chuyện
  function initChat() {
    // Goi qua chinh ten mien da tro san, khong can them ban ghi DNS rieng cho API.
    var API = "https://atl-web.lazinet.com/api/public/atl-chat";
    var FALLBACK = "https://atl-admin.lazinet.com/api/public/atl-chat";
    var E = function (s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    };
    var noDia = function (s) {
      return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
    };
    var STOP = ("la cua va cho thi mot nhung cac duoc co khi nao the gi voi trong tren den tu khong " +
      "phai nhu do ma se da lam hay ve bao nhieu o ai minh ban toi nay nhe").split(" ");

    function localAnswer(q) {
      var kb = window.ATL_KB || [];
      if (!kb.length) return null;
      // Giu ca am tiet hai chu (ma, so, thue, co) vi nhieu tu khoa tieng Viet la
      // hai chu, va dung them cap tu lien ke de phan biet nghia.
      var raw = noDia(q).split(/[^a-z0-9]+/).filter(Boolean);
      var terms = raw.filter(function (t) { return t.length >= 2 && STOP.indexOf(t) < 0; });
      var pairs = [];
      for (var pi = 0; pi < raw.length - 1; pi++) {
        if (raw[pi].length >= 2 && raw[pi + 1].length >= 2) pairs.push(raw[pi] + " " + raw[pi + 1]);
      }
      if (!terms.length && !pairs.length) return null;
      // Cung cach cham diem nhu phia dich vu: tu cang pho bien trong ho so thi
      // cang it gia tri phan biet, nen nhan trong so nghich dao do pho bien.
      var docs = kb.map(function (k) {
        return { hay: noDia(k.t + " " + k.k + " " + k.b), head: noDia(k.t + " " + k.k),
                 title: noDia(k.t) };
      });
      var w = {};
      terms.concat(pairs).forEach(function (t) {
        var df = 0;
        docs.forEach(function (d) { if (d.hay.indexOf(t) >= 0) df++; });
        w[t] = Math.log(1 + docs.length / (1 + df));
      });
      var sc = kb.map(function (k, i) {
        var d = docs[i], s = 0;
        terms.forEach(function (t) {
          var n = Math.min(d.hay.split(t).length - 1, 2);
          if (n) s += n * w[t];
          if (d.head.indexOf(t) >= 0) s += 4 * w[t];
          if (d.title.indexOf(t) >= 0) s += 6;
        });
        pairs.forEach(function (p) {
          if (d.hay.indexOf(p) >= 0) s += 3 * w[p];
          if (d.head.indexOf(p) >= 0) s += 8 * w[p];
          if (d.title.indexOf(p) >= 0) s += 10;
        });
        return { k: k, s: s };
      }).filter(function (x) { return x.s > 0; })
        .sort(function (a, b) { return b.s - a.s; }).slice(0, 3);
      if (!sc.length) return null;
      var txt = sc[0].k.b.split(". ").slice(0, 5).join(". ");
      if (!/[.!?]$/.test(txt)) txt += ".";
      return { answer: txt, sources: sc.map(function (x) { return { title: x.k.t }; }), offline: true };
    }

    var fab = document.createElement("button");
    fab.className = "cbot-fab";
    fab.innerHTML = "<i></i>Hỏi về hồ sơ này";
    document.body.appendChild(fab);

    var box = document.createElement("div");
    box.className = "cbot";
    box.innerHTML =
      '<div class="cbot-panel"><div class="cbot-head">' +
      "<b>Trợ lý hồ sơ<span>Trả lời trong phạm vi hồ sơ này, luôn kèm căn cứ</span></b>" +
      '<button id="cbot-x" aria-label="Đóng">&times;</button></div>' +
      '<div class="cbot-body" id="cbot-body"></div>' +
      '<div class="cbot-foot"><div class="cbot-row">' +
      '<input id="cbot-q" placeholder="Hỏi bằng tiếng Việt thường" autocomplete="off">' +
      '<button id="cbot-send">Hỏi</button></div>' +
      '<div class="cbot-note">Trợ lý chỉ dùng nội dung trong hồ sơ này. Chỗ nào là giả định đều được nói rõ.</div>' +
      "</div></div>";
    document.body.appendChild(box);

    var body = box.querySelector("#cbot-body");
    var input = box.querySelector("#cbot-q");
    var send = box.querySelector("#cbot-send");

    var SUGG = [
      "Vấn đề nghiêm trọng nhất của website hiện tại là gì",
      "Chi phí một chứng từ giảm được bao nhiêu",
      "Hai mô hình hợp tác khác nhau thế nào",
      "Bao lâu thì hoàn vốn",
      "Phần nào trong hồ sơ là giả định",
      "Đã dựng xong những gì rồi",
      "LAZINET là ai, đã làm những gì",
      "Người sáng lập LAZINET có kinh nghiệm gì",
    ];

    function greet() {
      body.innerHTML =
        '<div class="cbot-msg ai"><b>Chào anh.</b> Tôi nắm toàn bộ hồ sơ này: hiện trạng khảo sát, ' +
        "các điểm nghẽn, bối cảnh ngành, kiến trúc giải pháp, lộ trình, hai mô hình hợp tác, " +
        "phần đã dựng xong, và cả hồ sơ của LAZINET cùng người sáng lập." +
        '</div><div class="cbot-sugg">' +
        SUGG.map(function (q) { return "<button>" + E(q) + "</button>"; }).join("") + "</div>";
      body.querySelectorAll(".cbot-sugg button").forEach(function (b) {
        b.addEventListener("click", function () { ask(b.textContent); });
      });
    }

    function add(cls, html) {
      var d = document.createElement("div");
      d.className = "cbot-msg " + cls;
      d.innerHTML = html;
      body.appendChild(d);
      body.scrollTop = body.scrollHeight;
      return d;
    }

    var busy = false;
    async function call(url, q, ms) {
      var c = new AbortController();
      var t = setTimeout(function () { c.abort(); }, ms);
      try {
        var r = await fetch(url, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }), signal: c.signal,
        });
        var d = await r.json();
        return r.ok && d.answer ? d : null;
      } finally { clearTimeout(t); }
    }

    async function ask(q) {
      q = String(q || "").trim();
      if (!q || q.length < 3 || busy) return;
      busy = true; send.disabled = true; input.value = "";
      var sg = body.querySelector(".cbot-sugg");
      if (sg) sg.remove();
      add("me", E(q));
      var ph = add("ai", '<span class="cbot-dots"><span></span><span></span><span></span></span> Đang tra hồ sơ...');

      var out = null;
      try { out = await call(API, q, 20000); } catch (e) {}
      if (!out) { try { out = await call(FALLBACK, q, 20000); } catch (e) {} }
      if (!out) out = localAnswer(q);

      if (!out) {
        ph.innerHTML = "Câu này nằm ngoài phạm vi hồ sơ. Tôi trả lời được về hiện trạng khảo sát, " +
          "điểm nghẽn vận hành, bối cảnh ngành, kiến trúc giải pháp, lộ trình, hai mô hình hợp tác, " +
          "phần đã dựng xong, hồ sơ LAZINET và người sáng lập.";
      } else {
        ph.innerHTML = E(out.answer) +
          (out.sources && out.sources.length
            ? '<div class="cbot-src"><b>Căn cứ trong hồ sơ</b>' +
              out.sources.map(function (s) { return "- " + E(s.title); }).join("<br>") + "</div>"
            : "") +
          (out.offline ? '<span class="cbot-badge off">trả lời ngoại tuyến</span>' : "");
      }
      body.scrollTop = body.scrollHeight;
      busy = false; send.disabled = false;
    }

    fab.addEventListener("click", function () {
      box.classList.add("open"); fab.classList.add("hide");
      if (!body.innerHTML.trim()) greet();
      setTimeout(function () { if (window.innerWidth >= 720) input.focus(); }, 60);
    });
    box.querySelector("#cbot-x").addEventListener("click", function () {
      box.classList.remove("open"); fab.classList.remove("hide");
    });
    box.addEventListener("click", function (e) {
      if (e.target === box) { box.classList.remove("open"); fab.classList.remove("hide"); }
    });
    send.addEventListener("click", function () { ask(input.value); });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") ask(input.value); });
  }
})();
</script>
</body>
</html>
