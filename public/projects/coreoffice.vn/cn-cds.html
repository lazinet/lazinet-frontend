<style>
:root{--navy:#0F1F5C;--orange:#F38B00;--orange-t:#B85600;--ink:#141B2D;--ink2:#3F4B5E;--line:#D5DAE3;--tint:#F2F5FA;--tint-o:#FEF4E8;--bg:#FFFFFF;--green:#15803D;--red:#B91C1C}
*{box-sizing:border-box;border-radius:0!important}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Be Vietnam Pro",Arial,sans-serif}
a{color:var(--navy)}
.side{position:fixed;inset:0 auto 0 0;width:264px;background:var(--navy);color:#fff;padding:22px 0;overflow:auto;z-index:20}
.side .brand{padding:0 22px 18px;border-bottom:1px solid rgba(255,255,255,.18)}
.side .brand img{background:#fff;padding:8px 12px;height:58px;display:block}
.side .brand b{display:block;margin-top:12px;font-size:14px;letter-spacing:.02em}
.side .brand span{font-size:12px;color:#DCE3F0}
.side nav{padding:10px 0}
.side nav a{display:flex;gap:10px;padding:8px 22px;color:#E8EDF7;text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
.side nav a span{color:var(--orange);font-weight:700;width:22px}
.side nav a:hover,.side nav a.on{background:rgba(255,255,255,.08);border-left-color:var(--orange);color:#fff}
.side .files{padding:14px 22px;border-top:1px solid rgba(255,255,255,.18)}
.side .files a{display:block;margin:6px 0;padding:8px 10px;background:#fff;color:var(--navy);font-weight:700;font-size:13px;text-decoration:none}
.side .files a.o{background:var(--orange);color:#fff}
main{margin-left:264px;max-width:1180px;padding:0 40px 60px}
.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;align-items:center;z-index:10}
.top .t{font-weight:700;color:var(--navy)}
.top .d{color:var(--ink2);font-size:13px}
.menu{display:none;background:var(--navy);color:#fff;border:0;padding:8px 12px;font:inherit;font-weight:700}
.hero{padding:40px 0 26px;border-bottom:4px solid var(--orange)}
.hero .k{color:var(--orange-t);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-size:40px;line-height:1.15;color:var(--navy);margin:8px 0 10px}
.hero p{color:var(--ink2);margin:0;font-size:16px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:18px;font-size:13.5px}
.hero .meta b{color:var(--navy)}
section{padding:44px 0 8px;border-bottom:1px solid var(--line)}
.kicker{color:var(--orange-t);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
h2{font-size:27px;line-height:1.25;color:var(--navy);margin:6px 0 18px;padding-bottom:12px;background:linear-gradient(var(--orange),var(--orange)) left bottom/64px 4px no-repeat}
h3{font-size:17px;color:var(--navy);margin:26px 0 10px}
h4{font-size:15px;color:var(--navy);margin:0 0 8px}
.lead{font-size:16px}
.muted{color:var(--ink2);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.grid2.wide{grid-template-columns:1.25fr 1fr}
.grid2>*,.arch>*{min-width:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats.three{grid-template-columns:repeat(3,1fr);margin-bottom:18px}
.stats.two{margin-bottom:14px}
.stats.one{grid-template-columns:1fr;margin-bottom:12px}
.stat{border:1px solid var(--line);border-left:5px solid var(--navy);padding:12px 14px;background:#fff}
.stat.o{border-left-color:var(--orange)}
.stat .sv{font-size:25px;font-weight:800;color:var(--navy);line-height:1.2}
.stat.o .sv{color:var(--orange-t)}
.stat .sl{font-weight:700;font-size:13.5px;margin-top:2px}
.stat .ss{color:var(--ink2);font-size:12.5px;margin-top:2px}
ol.decisions{margin:0;padding:0;list-style:none;counter-reset:d}
ol.decisions li{counter-increment:d;position:relative;padding:0 0 14px 48px;font-size:14.5px}
ol.decisions li:before{content:counter(d,decimal-leading-zero);position:absolute;left:0;top:-3px;font-size:24px;font-weight:800;color:var(--orange-t)}
ol.decisions b{color:var(--navy)}
.callout{background:var(--tint);border-left:5px solid var(--navy);padding:14px 18px;margin:18px 0;font-size:14.5px}
.callout.o{background:var(--tint-o);border-left-color:var(--orange)}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ph{border:1px solid var(--line)}
.ph h4{background:var(--c);color:#fff;margin:0;padding:10px 14px;font-size:16px}
.ph h4 small{display:block;font-weight:400;font-size:12.5px}
.ph p{margin:10px 14px;font-size:13.5px}
.ph .role{color:var(--ink2);border-top:1px solid var(--line);padding-top:8px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mcard{border:1px solid var(--line);padding:14px 16px 12px 66px;position:relative;min-height:150px}
.mcard .mn{position:absolute;left:0;top:0;width:50px;height:50px;background:var(--navy);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.mcard:nth-child(even) .mn{background:var(--orange)}
.mcard h4{margin:0 0 6px;letter-spacing:.03em}
.mcard h4 small{display:block;font-weight:400;color:var(--ink2);font-size:12.5px;letter-spacing:0}
.mcard p{margin:0 0 6px;font-size:13.5px}
.mcard .weak{color:var(--red);font-size:12.5px}
.asks{display:grid;gap:8px}
.ask{display:flex;gap:14px;align-items:center;border:1px solid var(--line);padding:8px 12px 8px 0}
.ask .al{width:54px;height:54px;flex:none;color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ask b{color:var(--navy)}
.box{border:1px solid var(--line);padding:0 0 6px}
.box .bh{background:var(--navy);color:#fff;margin:0 0 6px;padding:9px 14px}
.box .bh.o{background:var(--orange);color:#1A1205}
.box ul,.box ol,.box p,.box .tbl-wrap{margin-left:14px;margin-right:14px}
ul{padding-left:20px;margin:8px 0}
ul li{margin:5px 0}
ul.plus{list-style:none;padding-left:4px}
ul.plus li:before{content:"+";color:var(--green);font-weight:800;margin-right:8px}
.red{color:var(--red)}.dk{color:var(--orange-t)}.gr{color:var(--green)}.neg{color:var(--red)}
.tbl-wrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:700;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:top}
tbody tr:nth-child(even) td{background:#FAFBFD}
table.compact td,table.compact th{padding:6px 8px;font-size:13px}
td.r{text-align:right;white-space:nowrap}td.c{text-align:center}
.arch{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:stretch;margin-bottom:12px}
.core{background:var(--navy);color:#fff;padding:22px;display:flex;flex-direction:column;justify-content:center}
.core b{font-size:28px;letter-spacing:.06em}
.core span{font-size:14px;margin-top:8px;color:#E8EDF7}
.sats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sat{border:1px solid var(--navy);border-left:5px solid var(--orange);padding:9px 12px}
.sat b{display:block;color:var(--navy)}
.sat span{font-size:13px;color:var(--ink2)}
.sbar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:8px 0}
.sbar .sl{font-size:13.5px;font-weight:700}
.sbar .st{background:var(--tint);height:22px}
.sbar .sf{background:#A8B2C4;height:100%}
.sbar .sf.best{background:var(--navy)}
.sbar .sv{font-weight:800;color:var(--navy)}
.chartbox{border:1px solid var(--line);padding:6px 14px 10px}
.chartbox h3{margin:8px 0}
svg.chart{width:100%;height:auto;display:block}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--ink2);font-size:12px}
svg .val{fill:var(--ink);font-size:12px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
table.gantt{font-size:12.5px}
table.gantt th{padding:6px 4px;font-size:11px;text-align:center}
table.gantt th.nm{text-align:left;min-width:250px}
table.gantt td{padding:5px 6px}
table.gantt td.q{padding:0;width:20px;min-width:20px;border-left:1px solid #EEF1F6}
table.gantt td.code{font-weight:800;white-space:nowrap}
table.gantt .cont{display:block;font-size:11.5px;color:var(--ink2)}
details{margin:14px 0}
summary{cursor:pointer;font-weight:700;color:var(--navy)}
ol.num{padding-left:22px}ol.num li{margin:6px 0}
.sign{display:flex;flex-wrap:wrap;gap:24px 40px;margin:26px 0 10px}
.sign div{border-top:2px solid var(--navy);padding-top:8px;min-width:240px;display:flex;flex-direction:column}
.sign b{color:var(--navy);font-size:16px}
.dl{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;padding:10px 16px}
.btn.o{background:var(--orange);color:#1A1205}
.btn.line{background:#fff;color:var(--navy);border:2px solid var(--navy);padding:8px 14px;line-height:1.3}
.btn.line small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.media{margin:12px 0 22px;border:1px solid var(--line);padding:8px;background:#fff}
.media img,.media video{display:block;width:100%;height:auto;background:#0F1F5C}
.media figcaption{font-size:13px;color:var(--ink2);padding:8px 2px 0}
footer{margin-left:264px;padding:20px 40px;color:var(--ink2);font-size:12.5px;border-top:1px solid var(--line)}
.gate{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.gate-card{border:1px solid var(--line);border-top:5px solid var(--navy);padding:28px;max-width:380px;width:100%;text-align:center}
.gate-card img{height:70px}
.gate-card h1{font-size:18px;color:var(--navy);margin:14px 0 6px}
.gate-card p{font-size:13.5px;color:var(--ink2);margin:0 0 16px}
.gate-card input{width:100%;padding:11px 12px;border:1px solid #9AA6B8;font:inherit}
.gate-card input:focus{outline:2px solid var(--orange);outline-offset:1px}
.gate-card button{width:100%;margin-top:10px;padding:11px;background:var(--navy);color:#fff;border:0;font:inherit;font-weight:700;cursor:pointer}
.gate-err{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin-top:8px}
body.locked .side,body.locked main,body.locked footer{display:none}
@media (max-width:1000px){
 .side{transform:translateX(-100%);transition:transform .2s}
 .side.open{transform:none}
 main,footer{margin-left:0;padding:0 16px 40px}
 footer{padding:16px}
 .menu{display:inline-block}
 .grid2,.grid2.wide,.arch{grid-template-columns:1fr}
 .phases,.mgrid{grid-template-columns:1fr 1fr}
 .stats.three{grid-template-columns:1fr}
 .hero h1{font-size:30px}
}
@media (max-width:600px){.phases,.mgrid,.stats,.sats{grid-template-columns:1fr}.sbar{grid-template-columns:110px 1fr 40px}h2{font-size:22px}}
@media print{.side,.top,.gate,.dl{display:none!important}main,footer{margin:0;max-width:none}section{break-inside:avoid-page}}

.boot{position:fixed;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .35s}
.boot.out{opacity:0;pointer-events:none}
.boot img{height:64px}
.boot-bar{width:220px;height:4px;background:var(--tint);position:relative;overflow:hidden}
.boot-bar i{position:absolute;left:0;top:0;bottom:0;width:35%;background:var(--orange);animation:bb 1.1s infinite ease-in-out}
@keyframes bb{0%{left:-35%}100%{left:100%}}
.boot-t{font-size:13px;color:var(--ink2)}
.gate-card{max-width:570px;padding:40px 44px}
.gate-card img{height:84px}
.gate-card h1{font-size:23px;line-height:1.3;margin:18px 0 8px;text-wrap:balance}
.gate-card p{font-size:14.5px}
.gate-card input,.gate-card button{padding:13px 14px;font-size:16px}
.gate-card .warn{margin-top:20px;border-left:4px solid var(--orange);background:var(--tint-o);padding:11px 14px;text-align:left;font-size:13.5px;line-height:1.55;color:var(--ink)}
.gate-card .warn b{color:var(--orange-t)}
.gate-hint{color:var(--navy);font-size:13.5px;font-weight:700;min-height:0;margin-top:10px}
@media(max-width:600px){.gate-card{padding:28px 20px}.gate-card img{height:70px}.gate-card h1{font-size:20px}}
.cb-fab.pre{z-index:55}
.gate-card form{margin:0}
.gate-card .lock{font-size:12px;color:var(--ink2);margin-top:14px;line-height:1.5}
.askbot{margin-left:12px;background:none;border:1px solid var(--line);color:var(--navy);font:700 11px/1 "Be Vietnam Pro",Arial,sans-serif;letter-spacing:0;text-transform:none;padding:5px 8px;cursor:pointer;vertical-align:1px}
.askbot:hover{border-color:var(--orange);color:var(--orange-t)}
.selask{position:absolute;z-index:40;background:var(--navy);color:#fff;border:0;font:700 12.5px "Be Vietnam Pro",Arial,sans-serif;padding:7px 11px;cursor:pointer;box-shadow:0 6px 18px rgba(15,31,92,.3);display:none}
.selask.on{display:block}
.cb-fab{position:fixed;right:18px;bottom:18px;z-index:45;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border:0;padding:12px 16px 12px 12px;font:700 14px "Be Vietnam Pro",Arial,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(15,31,92,.35)}
.cb-fab .av{width:30px;height:30px;background:#fff;display:flex;align-items:center;justify-content:center}
.cb-fab .av img{height:20px}
.cb-fab small{display:block;font-weight:400;font-size:11px;color:#C9D3EA}
.cb-fab .dot{width:9px;height:9px;background:#36D17A;position:absolute;left:36px;top:9px;border:2px solid var(--navy)}
.cb-fab.hide{display:none}
.cb{position:fixed;inset:0;z-index:50;display:none;background:rgba(15,31,92,.4)}
.cb.open{display:block}
.cb-panel{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column}
.cb-head{background:var(--navy);color:#fff;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px;flex:none}
.cb-head .av{width:38px;height:38px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.cb-head .av img{height:24px}
.cb-head b{flex:1;font-size:15px;line-height:1.25}
.cb-head b span{display:block;font-weight:400;font-size:11.5px;color:#C9D3EA}
.cb-head button{background:rgba(255,255,255,.14);border:0;color:#fff;height:32px;min-width:32px;padding:0 8px;cursor:pointer;font:700 12px "Be Vietnam Pro",Arial,sans-serif}
.cb-head button:hover{background:rgba(255,255,255,.26)}
.cb-body{flex:1;overflow-y:auto;padding:16px;background:#F6F8FC;-webkit-overflow-scrolling:touch}
.cb-msg{margin:0 0 14px;font-size:14px;line-height:1.62}
.cb-msg.me{background:var(--navy);color:#fff;padding:10px 13px;margin-left:auto;max-width:86%;width:-webkit-fit-content;width:fit-content;white-space:pre-wrap}
.cb-msg.ai{background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);padding:12px 14px;color:var(--ink)}
.cb-msg.ai p{margin:0 0 8px}.cb-msg.ai p:last-child{margin:0}
.cb-msg.ai ul,.cb-msg.ai ol{margin:4px 0 8px;padding-left:20px}
.cb-msg.ai li{margin:3px 0}
.cb-msg.ai strong{color:var(--navy)}
.cb-msg.ai h5{font-size:14px;color:var(--navy);margin:10px 0 6px}
.cb-msg.ai table{font-size:12.5px;margin:6px 0 10px;width:100%}
.cb-msg.ai th{padding:5px 7px;font-size:12px;white-space:normal}
.cb-msg.ai td{padding:5px 7px}
.cb-msg.ai code{background:var(--tint);padding:1px 4px;font-size:12.5px}
.cb-tblw{overflow-x:auto}
.cite{display:inline-block;border:1px solid #C9D3EA;background:var(--tint);color:var(--navy);font:700 11px/1.5 "Be Vietnam Pro",Arial,sans-serif;padding:0 6px;margin:0 2px;vertical-align:1px;cursor:default;white-space:nowrap}
button.cite{cursor:pointer}button.cite:hover{border-color:var(--orange);color:var(--orange-t)}
.cb-tools{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.cb-tools button{background:none;border:1px solid var(--line);color:var(--ink2);font:600 11.5px "Be Vietnam Pro",Arial,sans-serif;padding:4px 8px;cursor:pointer}
.cb-tools button:hover{color:var(--navy);border-color:var(--navy)}
.cb-tools .badge{font-size:11px;color:var(--orange-t);font-weight:700}
.cb-fu{display:flex;flex-direction:column;gap:6px;margin:-4px 0 14px}
.cb-fu button,.cb-sg button{text-align:left;background:#fff;border:1px solid var(--line);padding:8px 11px;font:600 13px "Be Vietnam Pro",Arial,sans-serif;color:var(--navy);cursor:pointer}
.cb-fu button:hover,.cb-sg button:hover{border-color:var(--orange)}
.cb-fu button:before{content:"=> ";color:var(--orange-t)}
.cb-sg h6{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-t);margin:12px 0 6px}
.cb-sg div{display:grid;gap:6px}
.cb-think{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px}
.cb-think i{display:inline-block;width:7px;height:7px;background:var(--navy);margin-right:3px;animation:cbd 1s infinite}
.cb-think i:nth-child(2){animation-delay:.15s}.cb-think i:nth-child(3){animation-delay:.3s;background:var(--orange)}
@keyframes cbd{0%,100%{opacity:.25}50%{opacity:1}}
.cb-foot{flex:none;border-top:1px solid var(--line);background:#fff;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.cb-row{display:flex;gap:8px;align-items:flex-end}
.cb-row textarea{flex:1;min-width:0;resize:none;max-height:140px;padding:10px 12px;border:1px solid #9AA6B8;font:400 16px/1.45 "Be Vietnam Pro",Arial,sans-serif;color:var(--ink)}
.cb-row textarea:focus{outline:2px solid var(--orange);outline-offset:-1px}
.cb-row button{background:var(--navy);color:#fff;border:0;height:44px;padding:0 16px;font:700 14px "Be Vietnam Pro",Arial,sans-serif;cursor:pointer}
.cb-row button:disabled{opacity:.45;cursor:not-allowed}
.cb-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:11.5px;color:var(--ink2)}
.cb-opt label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;color:var(--navy)}
.cb-opt input{accent-color:var(--navy)}
#cb-wide{display:none}
.cb-fab .av,.cb-head .av{border-radius:50%!important;overflow:hidden;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.cb-fab .av{width:34px;height:34px}.cb-head .av{width:40px;height:40px}
.cb-fab .av img,.cb-head .av img{width:100%;height:100%;object-fit:contain}
.cb-fab .dot{left:38px;top:8px;border-radius:50%!important}
@media(min-width:760px){
 #cb-wide{display:block}
 .cb{background:transparent;inset:auto;right:18px;bottom:18px;width:460px;height:min(720px,86vh)}
 .cb.wide{width:min(860px,calc(100vw - 300px))}
 .cb-panel{border:1px solid var(--line);box-shadow:0 22px 60px rgba(15,31,92,.32)}
}

.pdfv{border:1px solid var(--line);background:#E9EDF5;margin:12px 0 26px;display:flex;flex-direction:column;height:min(80vh,820px);min-height:420px;outline:none;position:relative}
.pdfv:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.pdfv.fs{position:fixed;inset:0;z-index:80;height:100%;margin:0;border:0}
.pv-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:7px 10px;flex:none}
.pv-bar button{background:rgba(255,255,255,.12);border:0;color:#fff;height:32px;min-width:32px;padding:0 10px;font:700 13px "Be Vietnam Pro",Arial,sans-serif;cursor:pointer}
.pv-bar button:hover{background:rgba(255,255,255,.24)}
.pv-bar button:disabled{opacity:.4;cursor:default}
.pv-bar .sep{width:1px;height:22px;background:rgba(255,255,255,.25);margin:0 4px}
.pv-bar .pg{display:flex;align-items:center;gap:6px;font-size:13px;color:#DCE3F0}
.pv-bar input{width:46px;height:32px;border:0;text-align:center;font:700 16px "Be Vietnam Pro",Arial,sans-serif;color:var(--navy)}
.pv-bar .zm{min-width:52px;text-align:center;font-size:13px;font-weight:700}
.pv-bar .grow{flex:1}
.pv-bar .ttl{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.pv-main{flex:1;display:flex;min-height:0}
.pv-thumbs{width:168px;flex:none;overflow-y:auto;background:#DCE2EE;padding:10px;border-right:1px solid var(--line)}
.pv-thumbs.off{display:none}
.pv-th{display:block;width:100%;background:none;border:2px solid transparent;padding:0;margin:0 0 10px;cursor:pointer;position:relative}
.pv-th canvas{display:block;width:100%;background:#fff;box-shadow:0 1px 4px rgba(15,31,92,.18)}
.pv-th span{position:absolute;left:4px;bottom:4px;background:var(--navy);color:#fff;font:700 10.5px "Be Vietnam Pro",Arial,sans-serif;padding:1px 5px}
.pv-th.on{border-color:var(--orange)}
.pv-pane{flex:1;overflow:auto;padding:18px;-webkit-overflow-scrolling:touch}
.pv-page{margin:0 auto 18px;background:#fff;box-shadow:0 4px 18px rgba(15,31,92,.18);position:relative}
.pv-page canvas{display:block;width:100%;height:100%}
.pv-page .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:13px}
.pv-load{position:absolute;inset:46px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink2);font-size:14px;background:#E9EDF5;text-align:center;padding:16px}
.pv-load .boot-bar{width:200px}

  }
  async function drawThumb(t){if(t.done)return;t.done=1;var pg=await doc.getPage(t.i);var vp0=pg.getViewport({scale:1});var vp=pg.getViewport({scale:(150*dpr)/vp0.width});
    var c=$("canvas",t.el);c.width=Math.round(vp.width);c.height=Math.round(vp.height);await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise}
  function setCur(i){cur=i;inp.value=i;$('[data-a=prev]',bar).disabled=i<=1;$('[data-a=next]',bar).disabled=i>=n;
    ths.forEach(function(t){t.el.classList.toggle("on",t.i===i)});var t=ths[i-1];if(t&&!thumbs.classList.contains("off")){var r=t.el.offsetTop-thumbs.clientHeight/2;if(Math.abs(thumbs.scrollTop-r)>120)thumbs.scrollTop=r}}
  function go(i){i=Math.max(1,Math.min(n,i|0));var p=pages[i-1];if(p){pane.scrollTop=p.el.offsetTop-12;setCur(i)}}
  var vis=new IntersectionObserver(function(es){es.forEach(function(en){var p=pages[+en.target.dataset.i-1];if(en.isIntersecting)draw(p)})},{root:pane,rootMargin:"600px 0px"});
  pane.addEventListener("scroll",function(){var mid=pane.scrollTop+pane.clientHeight*0.35,best=1;pages.forEach(function(p){if(p.el.offsetTop<=mid)best=p.i});if(best!==cur)setCur(best)},{passive:true});
  function rezoom(z){var keep=cur;zoom=Math.max(.5,Math.min(3,z));setZoomLabel();layout();pages.forEach(function(p){vis.unobserve(p.el);vis.observe(p.el)});requestAnimationFrame(function(){go(keep)})}
  function setFs(on){
    var b=$('[data-a=fs]',bar);host.classList.toggle("fs",on);b.textContent=on?"Thoát":"Toàn màn hình";document.body.style.overflow=on?"hidden":"";setTimeout(function(){rezoom(zoom)},150)}
  bar.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var a=b.dataset.a;
    if(a==="fs"){var on=!host.classList.contains("fs");
      if(on&&host.requestFullscreen&&innerWidth>=760){host.requestFullscreen().catch(function(){})}else if(!on&&document.fullscreenElement){document.exitFullscreen().catch(function(){})}
      setFs(on);return}
    if(!doc)return;
    if(a==="prev")go(cur-1);else if(a==="next")go(cur+1);else if(a==="in")rezoom(zoom+.25);else if(a==="out")rezoom(zoom-.25);else if(a==="fit")rezoom(1);
    else if(a==="thumbs"){thumbs.classList.toggle("off");setTimeout(function(){rezoom(zoom)},30)}
    else if(a==="dl"){var d=$('main [data-enc=pdf]');if(d)d.click()}
  });
  document.addEventListener("fullscreenchange",function(){if(!document.fullscreenElement&&host.classList.contains("fs"))setFs(false)});
  inp.addEventListener("change",function(){go(parseInt(inp.value,10)||1)});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();go(parseInt(inp.value,10)||1)}});
  host.addEventListener("keydown",function(e){if(e.target===inp)return;
    if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();go(cur+1)}else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(cur-1)}
    else if(e.key==="Escape"&&host.classList.contains("fs")&&!document.fullscreenElement){setFs(false)}});
  var rt=0;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(doc)rezoom(zoom)},200)});
  async function start(){
    if(started)return;started=true;
    try{
      var encP=fetch(f.enc,{cache:"no-store"});
      if(!window.pdfjsLib)await loadScript(PDFJS.lib,PDFJS.libSri);
      var wr=await fetch(PDFJS.wk,{integrity:PDFJS.wkSri,mode:"cors",referrerPolicy:"no-referrer"});
      pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await wr.blob()],{type:"text/javascript"}));
      var r=await encP;if(!r.ok)throw new Error("enc "+r.status);
      var buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(f.iv)},KEY,await r.arrayBuffer());
      doc=await pdfjsLib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;
      n=doc.numPages;$(".tot",bar).textContent=n;
      var p1=await doc.getPage(1);var v=p1.getViewport({scale:1});ratio=v.height/v.width;
      for(var i=1;i<=n;i++){
        var el=document.createElement("div");el.className="pv-page";el.dataset.i=i;el.innerHTML='<div class="ph">Trang '+i+'</div>';pane.appendChild(el);pages.push({i:i,el:el,done:0});
        var th=document.createElement("button");th.type="button";th.className="pv-th";th.innerHTML='<canvas></canvas><span>'+i+'</span>';th.dataset.i=i;
        th.addEventListener("click",function(){go(+this.dataset.i)});thumbs.appendChild(th);ths.push({i:i,el:th,done:0});
      }
      pane.style.position="relative";
      layout();pages.forEach(function(p){vis.observe(p.el)});setZoomLabel();setCur(1);load.remove();
      var tq=ths.slice();(function nextThumb(){var t=tq.shift();if(!t)return;drawThumb(t).then(function(){setTimeout(nextThumb,30)})})();
    }catch(e){load.innerHTML='<span>Không mở được bản PDF trong trình duyệt này. Anh/chị dùng nút "Tải bản PDF" bên trên.</span>';}
  }
  new IntersectionObserver(function(es,o){if(es.some(function(x){return x.isIntersecting})){o.disconnect();start()}},{rootMargin:"500px 0px"}).observe(host);
}

var LABEL={phil:{"5M1T":"Triết lý 5M1T","ASK-HT":"Triết lý ASK-HT"},luutg:{network:"Danh mục LuuTG"},org:{people:"Nhân sự"},corenet:{features:"CoreNet"},proc:{"0926.001":"Phiếu 0926.001"},meta:{corebot:"Corebot"}};
function citeHtml(kind,val){
  if(kind==="sec"){var t=DATA.sections[val];if(t)return '<button class="cite" data-go="'+E(val)+'" title="'+E(t)+'">Mục: '+E(t.length>34?t.slice(0,32)+"...":t)+'</button>';}
  if(kind==="xlsx")return '<span class="cite" title="File Excel kế hoạch">Excel: '+E(val)+'</span>';
  if(kind==="b12")return '<span class="cite" title="Hồ sơ B12">B12/'+E(val)+'</span>';
  var l=(LABEL[kind]||{})[val]; return '<span class="cite">'+E(l||val)+'</span>';
}
function inline(s){
  s=s.replace(/\[(sec|xlsx|b12|phil|luutg|org|corenet|proc|meta):([^\]]{1,60})\]/g,function(_,k,v){return "\u0001"+k+"\u0002"+v+"\u0003"});
  s=E(s);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\u0001([a-z0-9]+)\u0002([^\u0003]*)\u0003/g,function(_,k,v){return citeHtml(k,v.replace(/&amp;/g,"&"))});
  return s;
}
function md(text){
  text=text.replace(/\s?[\u2014\u2013]\s?/g,function(m){return m.trim()===m?"-":" - "});
  var lines=text.split("\n"), out=[], i=0, list=null;
  function closeList(){if(list){out.push("</"+list+">");list=null}}
  while(i<lines.length){
    var l=lines[i];
    if(/^\s*\|.*\|\s*$/.test(l)){
      closeList(); var rows=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(lines[i]);i++}
      rows=rows.filter(function(r){return !/^\s*\|[\s:|-]+\|\s*$/.test(r)});
      var h='<div class="cb-tblw"><table>';
      rows.forEach(function(r,ri){var cells=r.trim().replace(/^\||\|$/g,"").split("|");h+="<tr>"+cells.map(function(c){return ri===0?"<th>"+inline(c.trim())+"</th>":"<td>"+inline(c.trim())+"</td>"}).join("")+"</tr>"});
      out.push(h+"</table></div>"); continue;
    }
    var m;
    if((m=l.match(/^\s*#{1,6}\s+(.*)/))){closeList();out.push("<h5>"+inline(m[1])+"</h5>");i++;continue}
    if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=="ul"){closeList();out.push("<ul>");list="ul"}out.push("<li>"+inline(m[1])+"</li>");i++;continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){closeList();out.push("<ol>");list="ol"}out.push("<li>"+inline(m[1])+"</li>");i++;continue}
    if(!l.trim()){closeList();i++;continue}
    closeList(); out.push("<p>"+inline(l)+"</p>"); i++;
  }
  closeList(); return out.join("");
}
function splitFollow(t){
  var fu=[], keep=[];
  t.split("\n").forEach(function(l){var m=l.match(/^\s*(?:>>|»)\s*(.+)/);if(m)fu.push(m[1].trim());else keep.push(l)});
  return {text:keep.join("\n").trim(),fu:fu.slice(0,3)};
}

var noDia=function(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase()};
function offline(q){
  var terms=noDia(q).split(/[^a-z0-9]+/).filter(function(t){return t.length>=3});
  if(!terms.length)return null;
  var best=null;
  DATA.kb.forEach(function(k){
    var hay=noDia(k.title+" "+k.text), s=0;
    terms.forEach(function(t){var n=hay.split(t).length-1;if(n)s+=Math.min(n,5)+(noDia(k.title).indexOf(t)>=0?4:0)});
    s=s/Math.sqrt(1+k.text.length/3000);
    if(!best||s>best.s)best={k:k,s:s};
  });
  if(!best||best.s<=0)return null;
  var txt=best.k.text, pos=0, nt=noDia(txt);
  terms.some(function(t){var p=nt.indexOf(t);if(p>=0){pos=Math.max(0,p-200);return true}});
  return "Corebot chưa kết nối được máy chủ AI, đây là đoạn liên quan nhất trong kho tri thức:\n\n"+txt.slice(pos,pos+900).trim()+(txt.length>pos+900?" ...":"")+"\n\n["+best.k.tag+"]";
}

function initBot(){

    '<button type="button" id="cb-new" title="Cuộc trò chuyện mới">Mới</button><button type="button" id="cb-wide" title="Mở rộng khung">Rộng</button><button type="button" id="cb-x" aria-label="Đóng">&times;</button></div>'+

  })});

  async function stream(url,payload,onDelta,onThink){
    var ctl=new AbortController(), to=setTimeout(function(){ctl.abort()},120000);

      var r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","X-Corebot-Key":CHATKEY},body:JSON.stringify(payload),signal:ctl.signal});
      if(!r.ok){var j=await r.json().catch(function(){return{}});var er=new Error(j.message||("HTTP "+r.status));er.http=r.status;throw er}
      var rd=r.body.getReader(), dec=new TextDecoder(), buf="", got=false;
      for(;;){
        var x=await rd.read(); if(x.done)break;

      }
      if(!got)throw new Error("empty");

  }

  async function ask(text){
