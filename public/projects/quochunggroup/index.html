<style>:root{--navy:#002060;--navy2:#0B1B3A;--blue:#0048E0;--qh:#1F4FA0;--orange:#FF6302;--orange-t:#B84A00;--ink:#141B2D;--ink2:#46526A;--line:#D9E0EC;--tint:#F1F5FC;--tint-o:#FFF3E8;--bg:#FFFFFF;--green:#0B7A3B;--red:#B91C1C;--r:10px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Be Vietnam Pro",Arial,sans-serif}
a{color:var(--blue)}
button{font-family:inherit}
/* ---------- khung */
.side{position:fixed;inset:0 auto 0 0;width:272px;background:linear-gradient(180deg,var(--navy) 0%,#00163F 100%);color:#fff;padding:20px 0;overflow:auto;z-index:20}
.side .brand{padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,.16)}
.side .logos{display:flex;align-items:center;gap:10px;background:#fff;border-radius:var(--r);padding:10px 12px}
.side .logos img{height:46px;display:block}
.side .logos .x{color:var(--ink2);font-weight:800}
.side .brand b{display:block;margin-top:12px;font-size:14.5px}
.side .brand span{font-size:12px;color:#C9D5EE}
.side nav{padding:10px 0}
.side nav a{display:flex;gap:10px;padding:8px 20px;color:#E4EBF8;text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
.side nav a span{color:var(--orange);font-weight:800;width:22px}
.side nav a:hover,.side nav a.on{background:rgba(255,255,255,.08);border-left-color:var(--orange);color:#fff}
.side .files{padding:14px 20px;border-top:1px solid rgba(255,255,255,.16)}
.side .files a{display:block;margin:6px 0;padding:9px 12px;background:#fff;color:var(--navy);font-weight:700;font-size:13px;text-decoration:none;border-radius:8px}
.side .files a.o{background:var(--orange);color:#fff}
.side .files small{display:block;color:#C9D5EE;font-size:11.5px;margin-top:8px;line-height:1.5}
main{margin-left:272px;max-width:1200px;padding:0 40px 60px}
.top{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:10}
.top .t{font-weight:800;color:var(--navy)}
.top .d{color:var(--ink2);font-size:13px}
.top .askall{background:var(--orange);color:#fff;border:0;padding:8px 14px;font-weight:700;border-radius:8px;cursor:pointer}
.menu{display:none;background:var(--navy);color:#fff;border:0;padding:8px 12px;font-weight:700;border-radius:8px}
.hero{padding:20px 0 10px}
.hero .k{color:var(--orange-t);font-weight:800;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase}
.hero h1{font-size:31px;line-height:1.2;color:var(--navy);margin:6px 0 8px}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p{color:var(--ink2);margin:0;font-size:16px;max-width:860px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 24px;margin:10px 0 14px;font-size:13px}
.hero .meta b{color:var(--navy)}
section{padding:40px 0 10px;border-bottom:1px solid var(--line)}
.kicker{color:var(--orange-t);font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
h2{font-size:27px;line-height:1.25;color:var(--navy);margin:6px 0 16px;padding-bottom:12px;background:linear-gradient(var(--orange),var(--orange)) left bottom/64px 4px no-repeat}
h3{font-size:17px;color:var(--navy);margin:24px 0 10px}
h4{font-size:15px;color:var(--navy);margin:0 0 6px}
.lead{font-size:16px}
.muted{color:var(--ink2);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:#fff;position:relative}
.card.top-b{border-top:4px solid var(--blue)}.card.top-o{border-top:4px solid var(--orange)}.card.top-n{border-top:4px solid var(--navy)}
.card p{margin:4px 0;font-size:14px}.card ul{margin:6px 0;padding-left:18px;font-size:14px}.card li{margin:3px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 16px}
.stat{border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:8px;padding:12px 14px;background:#fff}
.stat.o{border-left-color:var(--orange)}
.stat .sv{font-size:27px;font-weight:800;color:var(--navy);line-height:1.15}
.stat.o .sv{color:var(--orange-t)}
.stat .sl{font-weight:700;font-size:13.5px}
.stat .ss{color:var(--ink2);font-size:12.5px}
.callout{background:var(--tint);border-left:5px solid var(--navy);padding:13px 18px;margin:16px 0;font-size:14.5px;border-radius:0 8px 8px 0}
.callout.o{background:var(--tint-o);border-left-color:var(--orange)}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 16px}
.flow .st{border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.flow .st b{display:block;background:var(--blue);color:#fff;padding:8px 10px;font-size:13.5px}
.flow .st.o b{background:var(--orange)}.flow .st.n b{background:var(--navy)}
.flow .st p{margin:8px 10px;font-size:12.8px;color:var(--ink2)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--navy);border:1px solid #C9D6EE;margin:2px 4px 2px 0}
.pill.o{background:var(--tint-o);color:var(--orange-t);border-color:#FFC9A3}.pill.g{background:#E6F5EC;color:var(--green);border-color:#B5E0C5}
.tbl-wrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:700}
td{border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:top}
tbody tr:nth-child(even) td{background:#FAFBFE}
tr.hl td{background:#FFF6EC!important}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0}
.kpi{background:var(--tint);border-radius:8px;padding:12px;text-align:center}
.kpi:nth-child(even){background:var(--tint-o)}
.kpi b{display:block;font-size:24px;color:var(--blue)}.kpi:nth-child(even) b{color:var(--orange-t)}
.kpi span{font-size:12.5px;color:var(--navy)}
.score{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.score .s{border-radius:8px;padding:10px;font-size:12.5px}
.score .s b{display:block;font-size:13px;color:var(--navy)}
.score .s i{font-style:normal;font-weight:800;display:block;margin:4px 0}
.s.good{background:#E6F5EC}.s.good i{color:var(--green)}.s.mid{background:var(--tint)}.s.mid i{color:var(--blue)}
.s.low{background:var(--tint-o)}.s.low i{color:var(--orange-t)}.s.none{background:#F1F3F7}.s.none i{color:var(--ink2)}
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;font-size:14px}
.btn.o{background:var(--orange)}.btn.line{background:#fff;color:var(--navy);border:2px solid var(--navy);padding:8px 14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.dl{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
footer{margin-left:272px;padding:20px 40px;color:var(--ink2);font-size:12.5px;border-top:1px solid var(--line)}
/* ---------- cổng mật khẩu */
.gate{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%,#E8F0FF,#fff 60%);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.gate-card{background:#fff;border:1px solid var(--line);border-top:5px solid var(--orange);border-radius:14px;padding:38px 42px;max-width:580px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,32,96,.12)}
.gate-logos{display:flex;align-items:center;justify-content:center;gap:18px}
.gate-logos img{height:84px}
.gate-logos .x{font-size:26px;font-weight:800;color:var(--ink2)}
.gate-card h1{font-size:23px;line-height:1.3;color:var(--navy);margin:18px 0 8px}
.gate-card p{font-size:14.5px;color:var(--ink2);margin:0 0 16px}
.gate-card input{width:100%;padding:13px 14px;border:1px solid #9AA6B8;border-radius:8px;font:inherit;font-size:16px}
.gate-card input:focus{outline:2px solid var(--orange);outline-offset:1px}
.gate-card button{width:100%;margin-top:10px;padding:13px;background:var(--navy);color:#fff;border:0;border-radius:8px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.gate-err{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin-top:8px}
.gate-card .warn{margin-top:18px;border-left:4px solid var(--orange);background:var(--tint-o);padding:11px 14px;text-align:left;font-size:13px;line-height:1.55;border-radius:0 8px 8px 0}
.gate-card .warn b{color:var(--orange-t)}
body.locked .side,body.locked main,body.locked footer{display:none}
.boot{position:fixed;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .35s}
.boot.out{opacity:0;pointer-events:none}
.boot img{height:64px}
.boot-bar{width:220px;height:4px;background:var(--tint);position:relative;overflow:hidden;border-radius:4px}
.boot-bar i{position:absolute;left:0;top:0;bottom:0;width:35%;background:var(--orange);animation:bb 1.1s infinite ease-in-out}
@keyframes bb{0%{left:-35%}100%{left:100%}}
.boot-t{font-size:13px;color:var(--ink2)}
/* ---------- sách lật */
.flip{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#0B1B3A,#13306B);padding:18px 18px 0;position:relative;outline:none;box-shadow:0 18px 50px rgba(0,32,96,.18)}
.flip:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.flip.fs{position:fixed;inset:0;z-index:80;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding:20px}
.fb-stage{position:relative;max-width:min(1060px,max(520px,calc((100vh - 400px) * 1.7778)));margin:0 auto}
.flip.fs .fb-stage{max-width:min(100%,calc((100vh - 110px) * 1.7778));width:100%}
.fb-book{position:relative;aspect-ratio:16/9;perspective:2400px;cursor:pointer;user-select:none}
.fb-book img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:4px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.fb-leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;z-index:3;backface-visibility:hidden}
.fb-leaf[hidden]{display:none}
.fb-leaf img{box-shadow:0 0 0 rgba(0,0,0,0)}
.fb-leaf:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.28));opacity:0;transition:opacity .7s;border-radius:4px;pointer-events:none}
.fb-leaf.turning:after{opacity:1}
.fb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:44px;height:64px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-size:30px;cursor:pointer}
.fb-nav:hover{background:var(--orange)}
.fb-nav.prev{left:-58px}.fb-nav.next{right:-58px}
.fb-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#fff;padding:10px 4px 8px;max-width:1060px;margin:0 auto}
.flip.fs .fb-bar{width:100%}
.fb-bar button{background:rgba(255,255,255,.12);border:0;color:#fff;height:32px;min-width:32px;padding:0 11px;font-weight:700;font-size:13px;border-radius:6px;cursor:pointer}
.fb-bar button:hover{background:rgba(255,255,255,.26)}
.fb-bar .sep{width:1px;height:22px;background:rgba(255,255,255,.25);margin:0 4px}
.fb-bar .pg{font-size:13.5px;color:#DCE3F0;min-width:64px;text-align:center}
.fb-bar .pg b{color:#fff}
.fb-bar .grow{flex:1}
.fb-bar .ttl{font-size:13px;font-weight:700}
.fb-prog{height:3px;background:rgba(255,255,255,.15);max-width:1060px;margin:10px auto 0;border-radius:3px;overflow:hidden}
.fb-prog i{display:block;height:100%;background:var(--orange);width:0;transition:width .5s}
.fb-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:1060px;margin:0 auto;padding:4px 0 16px}
.fb-grid[hidden]{display:none}
.fb-grid button{border:2px solid transparent;padding:0;background:#fff;cursor:pointer;aspect-ratio:16/9;position:relative;border-radius:4px;overflow:hidden}
.fb-grid button.on{border-color:var(--orange)}
.fb-grid img{width:100%;height:100%;object-fit:cover;display:block}
.fb-grid span{position:absolute;left:4px;bottom:4px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:3px}
.fb-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#DCE3F0;font-size:14px;text-align:center;z-index:6;background:#0B1B3A;border-radius:4px}
.fb-hint{color:#AFC0E4;font-size:12px;text-align:center;padding:0 0 10px}
/* ---------- cấu hình chuyền */
.cfg{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.cfg .ctl{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--tint)}
.cfg label{display:block;font-weight:700;font-size:13.5px;color:var(--navy);margin:10px 0 4px}
.cfg input[type=range]{width:100%;accent-color:var(--orange)}
.cfg .val{float:right;color:var(--orange-t);font-weight:800}
.cfg .chk label{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink);margin:6px 0}
.cfg .chk input{accent-color:var(--navy);width:16px;height:16px}
.cfg .out{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:#fff}
.cfg svg{width:100%;height:auto;display:block}
.chk-res{margin:10px 0 0;padding:0;list-style:none;font-size:13.5px}
.chk-res li{padding:6px 10px;border-radius:6px;margin:5px 0}
.chk-res li.ok{background:#E6F5EC}.chk-res li.warn{background:var(--tint-o)}.chk-res li.info{background:var(--tint)}
/* ---------- phiếu khảo sát */
.sv-head{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.sv-head input,.sv-q textarea,.sv-tbl input,.sv-tbl select{width:100%;border:1px solid #AEB9CC;border-radius:6px;padding:8px 10px;font:inherit;font-size:14px;background:#fff}
.sv-head input:focus,.sv-q textarea:focus,.sv-tbl input:focus,.sv-tbl select:focus{outline:2px solid var(--orange);outline-offset:-1px}
.sv-prog{position:sticky;top:58px;z-index:5;background:#fff;padding:8px 0;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.sv-prog .bar{flex:1;height:8px;background:var(--tint);border-radius:8px;overflow:hidden}
.sv-prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--orange));transition:width .3s}
.sv-grp{border:1px solid var(--line);border-radius:var(--r);margin:12px 0;background:#fff}
.sv-grp>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;font-weight:700;color:var(--navy)}
.sv-grp>summary::-webkit-details-marker{display:none}
.sv-grp>summary .g{width:34px;height:34px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.sv-grp:nth-of-type(even)>summary .g{background:var(--orange)}
.sv-grp>summary small{display:block;font-weight:400;color:var(--ink2);font-size:12.5px}
.sv-grp>summary .cnt{margin-left:auto;font-size:12.5px;color:var(--ink2);font-weight:600;white-space:nowrap}
.sv-body{padding:2px 16px 14px}
.sv-q{margin:12px 0}
.sv-q .qt{font-weight:600;font-size:14.2px;margin-bottom:4px;display:flex;gap:8px;align-items:flex-start}
.sv-q .qt .c{color:var(--orange-t);font-weight:800;min-width:30px}
.sv-q .qt .star{color:var(--orange)}
.sv-q .hint{font-size:12.5px;color:var(--ink2);margin:0 0 4px 38px}
.sv-q textarea{min-height:44px;resize:vertical;margin-left:0}
.sv-q .ask{margin-left:auto;background:none;border:1px solid var(--line);color:var(--navy);font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;cursor:pointer;white-space:nowrap}
.sv-q .ask:hover{border-color:var(--orange);color:var(--orange-t)}
.sv-tbl td{vertical-align:middle}
.sv-tbl input[type=number]{width:64px;text-align:center}
.sv-tbl input[type=checkbox]{width:18px;height:18px;accent-color:var(--navy)}
.sv-act{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:5}
.sv-msg{font-size:13px;font-weight:700}
.sv-msg.ok{color:var(--green)}.sv-msg.err{color:var(--red)}
.sv-list{margin-top:10px}
/* ---------- QH Copilot */
.selask{position:absolute;z-index:40;background:var(--navy);color:#fff;border:0;font:700 12.5px "Be Vietnam Pro",Arial,sans-serif;padding:7px 11px;cursor:pointer;box-shadow:0 6px 18px rgba(0,32,96,.3);display:none;border-radius:6px}
.selask.on{display:block}
.cb-fab{position:fixed;right:18px;bottom:18px;z-index:45;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:0;padding:11px 18px 11px 11px;font:700 14px "Be Vietnam Pro",Arial,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(0,32,96,.35);border-radius:40px;text-align:left}
.cb-fab .av{width:38px;height:38px;background:#fff;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden}
.cb-fab .av img{width:80%;height:80%;object-fit:contain}
.cb-fab small{display:block;font-weight:400;font-size:11px;color:#C9D5EE}
.cb-fab .dot{width:10px;height:10px;background:#36D17A;position:absolute;left:41px;top:10px;border:2px solid var(--navy);border-radius:50%}
.cb-fab.hide{display:none}
.cb-fab.pulse{animation:pl 2s 3}
@keyframes pl{0%,100%{box-shadow:0 10px 30px rgba(0,32,96,.35)}50%{box-shadow:0 0 0 10px rgba(255,99,2,.25),0 10px 30px rgba(0,32,96,.35)}}
.cb{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,32,96,.4)}
.cb.open{display:block}
.cb-panel{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column}
.cb-head{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px;flex:none}
.cb-head .av{width:42px;height:42px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;border-radius:50%;overflow:hidden}
.cb-head .av img{width:80%;height:80%;object-fit:contain}
.cb-head b{flex:1;font-size:15px;line-height:1.25}
.cb-head b span{display:block;font-weight:400;font-size:11.5px;color:#C9D5EE}
.cb-head button{background:rgba(255,255,255,.16);border:0;color:#fff;height:32px;min-width:32px;padding:0 9px;cursor:pointer;font:700 12px "Be Vietnam Pro",Arial,sans-serif;border-radius:6px}
.cb-head button:hover{background:rgba(255,255,255,.3)}
.cb-body{flex:1;overflow-y:auto;padding:16px;background:#F5F8FD}
.cb-msg{margin:0 0 14px;font-size:14px;line-height:1.62}
.cb-msg.me{background:var(--navy);color:#fff;padding:10px 13px;margin-left:auto;max-width:86%;width:fit-content;white-space:pre-wrap;border-radius:12px 12px 2px 12px}
.cb-msg.ai{background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);padding:12px 14px;color:var(--ink);border-radius:2px 12px 12px 12px}
.cb-msg.ai p{margin:0 0 8px}.cb-msg.ai p:last-child{margin:0}
.cb-msg.ai ul,.cb-msg.ai ol{margin:4px 0 8px;padding-left:20px}
.cb-msg.ai li{margin:3px 0}
.cb-msg.ai strong{color:var(--navy)}
.cb-msg.ai h5{font-size:14px;color:var(--navy);margin:10px 0 6px}
.cb-msg.ai table{font-size:12.5px;margin:6px 0 10px}
.cb-msg.ai th{padding:5px 7px;font-size:12px}
.cb-msg.ai td{padding:5px 7px}
.cb-msg.ai code{background:var(--tint);padding:1px 4px;font-size:12.5px}
.cb-tblw{overflow-x:auto}
.cite{display:inline-block;border:1px solid #C9D5EE;background:var(--tint);color:var(--navy);font:700 11px/1.5 "Be Vietnam Pro",Arial,sans-serif;padding:0 6px;margin:0 2px;vertical-align:1px;white-space:nowrap;border-radius:4px}
button.cite{cursor:pointer}button.cite:hover{border-color:var(--orange);color:var(--orange-t)}
.cb-tools{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.cb-tools button{background:none;border:1px solid var(--line);color:var(--ink2);font:600 11.5px "Be Vietnam Pro",Arial,sans-serif;padding:4px 8px;cursor:pointer;border-radius:5px}
.cb-tools .badge{font-size:11px;color:var(--orange-t);font-weight:700}
.cb-fu{display:flex;flex-direction:column;gap:6px;margin:-4px 0 14px}
.cb-fu button,.cb-sg button{text-align:left;background:#fff;border:1px solid var(--line);padding:8px 11px;font:600 13px "Be Vietnam Pro",Arial,sans-serif;color:var(--navy);cursor:pointer;border-radius:8px}
.cb-fu button:hover,.cb-sg button:hover{border-color:var(--orange)}
.cb-fu button:before{content:"=> ";color:var(--orange-t)}
.cb-sg h6{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-t);margin:12px 0 6px}
.cb-sg div{display:grid;gap:6px}
.cb-think{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px}
.cb-think i{display:inline-block;width:7px;height:7px;background:var(--navy);margin-right:3px;border-radius:50%;animation:cbd 1s infinite}
.cb-think i:nth-child(2){animation-delay:.15s}.cb-think i:nth-child(3){animation-delay:.3s;background:var(--orange)}
@keyframes cbd{0%,100%{opacity:.25}50%{opacity:1}}
.cb-foot{flex:none;border-top:1px solid var(--line);background:#fff;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.cb-row{display:flex;gap:8px;align-items:flex-end}
.cb-row textarea{flex:1;min-width:0;resize:none;max-height:140px;padding:10px 12px;border:1px solid #9AA6B8;border-radius:8px;font:400 16px/1.45 "Be Vietnam Pro",Arial,sans-serif;color:var(--ink)}
.cb-row textarea:focus{outline:2px solid var(--orange);outline-offset:-1px}
.cb-row button{background:var(--orange);color:#fff;border:0;height:44px;padding:0 16px;font:700 14px "Be Vietnam Pro",Arial,sans-serif;cursor:pointer;border-radius:8px}
.cb-row button:disabled{opacity:.45;cursor:not-allowed}
.cb-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:11.5px;color:var(--ink2)}
.cb-opt label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;color:var(--navy)}
#cb-wide{display:none}
@media(min-width:760px){
 #cb-wide{display:block}
 .cb{background:transparent;inset:auto;right:18px;bottom:18px;width:470px;height:min(740px,88vh)}
 .cb.wide{width:min(880px,calc(100vw - 300px))}
 .cb-panel{border:1px solid var(--line);box-shadow:0 22px 60px rgba(0,32,96,.32);border-radius:14px;overflow:hidden}
}
@media (max-width:1000px){
 .side{transform:translateX(-100%);transition:transform .2s}
 .side.open{transform:none}
 main,footer{margin-left:0;padding:0 16px 40px}
 footer{padding:16px}
 .menu{display:inline-block}
 .grid2,.cfg{grid-template-columns:1fr}
 .grid3,.grid4,.stats,.score,.kpis{grid-template-columns:1fr 1fr}
 .flow{grid-template-columns:1fr 1fr 1fr}
 .hero h1{font-size:28px}
 .fb-nav{display:none}
 .sv-head{grid-template-columns:1fr 1fr}
 .fb-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:600px){.grid3,.grid4,.stats,.score,.kpis,.flow,.sv-head{grid-template-columns:1fr}h2{font-size:22px}.top .d{display:none}.flip{padding:10px 10px 0}
 .top .t{font-size:13px;line-height:1.3}.top .askall{padding:7px 10px;font-size:12.5px;white-space:nowrap}.menu{padding:7px 10px;font-size:12.5px;white-space:nowrap}
 .hero h1{font-size:24px}.hero p{font-size:14.5px}.hero .meta{font-size:12.5px}
 .fb-bar .ttl,.fb-bar [data-a=first],.fb-bar .sep,.fb-hint{display:none}.fb-bar button{padding:0 9px;font-size:12.5px}
 .cb-fab{padding:9px}.cb-fab>span:last-child{display:none}.cb-fab .dot{left:38px;top:7px}}
@media print{.side,.top,.gate,.dl,.cb,.cb-fab,.selask,.flip,.sv-act,.askall{display:none!important}main,footer{margin:0;max-width:none}.sv-grp{break-inside:avoid-page}}

  }

/* ------------------------------------------------------------------ QH Copilot */
function citeHtml(kind,val){
  if(kind==="dx"){var m=/s(\d+)/.exec(val);if(m)return '<button class="cite" data-page="'+m[1]+'" title="Mở trang '+m[1]+' của bản đề xuất">Đề xuất · tr.'+m[1]+"</button>"}
  if(kind==="ks")return '<button class="cite" data-ks="'+E(val)+'" title="Mở phần khảo sát">Phiếu khảo sát · '+E(val)+"</button>";
  if(kind==="web")return '<span class="cite" title="Thông tin công bố trên quochunggroup.com">Website QH · '+E(val)+"</span>";
  if(kind==="qh")return '<span class="cite">Quốc Hưng</span>';
  if(kind==="lz")return '<span class="cite">LAZINET</span>';
  return '<span class="cite">'+E(val)+"</span>";
}
function inline(s){
  s=s.replace(/\[(dx|ks|web|qh|lz):([^\]]{1,60})\]/g,function(_,k,v){return "\u0001"+k+"\u0002"+v+"\u0003"});
  s=E(s);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\u0001([a-z]+)\u0002([^\u0003]*)\u0003/g,function(_,k,v){return citeHtml(k,v.replace(/&amp;/g,"&"))});
  return s;
}
function md(text){
  text=text.replace(/\s?[\u2014\u2013]\s?/g,function(m){return m.trim()===m?"-":" - "});
  var lines=text.split("\n"), out=[], i=0, list=null;
  function closeList(){if(list){out.push("</"+list+">");list=null}}
  while(i<lines.length){
    var l=lines[i];
    if(/^\s*\|.*\|\s*$/.test(l)){
      closeList(); var rows=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(lines[i]);i++}
      rows=rows.filter(function(r){return !/^\s*\|[\s:|-]+\|\s*$/.test(r)});
      var h='<div class="cb-tblw"><table>';
      rows.forEach(function(r,ri){var cells=r.trim().replace(/^\||\|$/g,"").split("|");h+="<tr>"+cells.map(function(c){return ri===0?"<th>"+inline(c.trim())+"</th>":"<td>"+inline(c.trim())+"</td>"}).join("")+"</tr>"});
      out.push(h+"</table></div>"); continue;
    }
    var m;
    if((m=l.match(/^\s*#{1,6}\s+(.*)/))){closeList();out.push("<h5>"+inline(m[1])+"</h5>");i++;continue}
    if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=="ul"){closeList();out.push("<ul>");list="ul"}out.push("<li>"+inline(m[1])+"</li>");i++;continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){closeList();out.push("<ol>");list="ol"}out.push("<li>"+inline(m[1])+"</li>");i++;continue}
    if(!l.trim()){closeList();i++;continue}
    closeList(); out.push("<p>"+inline(l)+"</p>"); i++;
  }
  closeList(); return out.join("");
}
/* mô hình đôi khi tự đặt mã sản phẩm: chỉ giữ mã có thật trong kho tri thức */
function fixCodes(t){var ok={};(DATA.codes||[]).forEach(function(c){ok[c]=1});
  return t.replace(/\s?\(((?:QH|ZQ)-?[A-Z0-9]*\d[A-Z0-9-]*)\)/g,function(m,c){return ok[c]?m:""}).replace(/\b((?:QH|ZQ)-[A-Z]{2,}\d[A-Z0-9-]*)\b/g,function(m,c){return ok[c]?m:""})}
function splitFollow(t){t=fixCodes(t);var fu=[],keep=[];t.split("\n").forEach(function(l){var m=l.match(/^\s*(?:>>|»)\s*(.+)/);if(m)fu.push(m[1].trim());else keep.push(l)});return {text:keep.join("\n").trim(),fu:fu.slice(0,3)}}
var noDia=function(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase()};
function offline(q){
  var terms=noDia(q).split(/[^a-z0-9]+/).filter(function(t){return t.length>=3});if(!terms.length)return null;
  var best=null;
  DATA.kb.forEach(function(k){var hay=noDia(k.title+" "+k.text),s=0;terms.forEach(function(t){var n=hay.split(t).length-1;if(n)s+=Math.min(n,5)+(noDia(k.title).indexOf(t)>=0?4:0)});s=s/Math.sqrt(1+k.text.length/3000);if(!best||s>best.s)best={k:k,s:s}});
  if(!best||best.s<=0)return null;
  var txt=best.k.text,pos=0,nt=noDia(txt);terms.some(function(t){var p=nt.indexOf(t);if(p>=0){pos=Math.max(0,p-200);return true}});
  return "QH Copilot chưa kết nối được máy chủ AI, đây là đoạn liên quan nhất trong kho tri thức:\n\n"+txt.slice(pos,pos+900).trim()+(txt.length>pos+900?" ...":"")+"\n\n["+best.k.tag+"]";
}
function initBot(){
  var logo=DATA.mark;
  var fab=document.createElement("button");fab.className="cb-fab pulse";fab.type="button";
  fab.innerHTML='<span class="av"><img alt="" src="'+logo+'"></span><span class="dot"></span><span>Hỏi QH Copilot<small>Trợ lý AI · Quốc Hưng × LAZINET</small></span>';
  document.body.appendChild(fab);
  var box=document.createElement("div");box.className="cb";box.setAttribute("role","dialog");box.setAttribute("aria-label","QH Copilot");
  box.innerHTML='<div class="cb-panel"><div class="cb-head"><span class="av"><img alt="" src="'+logo+'"></span><b>QH Copilot<span>Hiểu Quốc Hưng · thử vai kỹ sư báo giá AI</span></b>'+
    '<button type="button" id="cb-new" title="Cuộc trò chuyện mới">Mới</button><button type="button" id="cb-wide" title="Mở rộng khung">Rộng</button><button type="button" id="cb-x" aria-label="Đóng">&times;</button></div>'+
    '<div class="cb-body" id="cb-body" aria-live="polite"></div>'+
    '<div class="cb-foot"><div class="cb-row"><textarea id="cb-q" rows="1" placeholder="Hỏi QH Copilot hoặc gửi thử một yêu cầu..." aria-label="Câu hỏi"></textarea><button type="button" id="cb-send">Gửi</button></div>'+
    '<div class="cb-opt"><label><input type="checkbox" id="cb-deep"> Trả lời chi tiết</label><span>Tiếng Việt, English, 한국어, 中文</span></div></div></div>';
  document.body.appendChild(box);
  var body=$("#cb-body"),q=$("#cb-q"),send=$("#cb-send"),deep=$("#cb-deep"),hist=[],busy=false;
  function greet(){
    body.innerHTML='<div class="cb-msg ai"><p><strong>QH Copilot xin chào anh/chị.</strong> QH Copilot đã đọc bản đề xuất, 508 trang sản phẩm trên website Quốc Hưng và phiếu khảo sát.</p>'+
      '<p>Anh/chị có thể hỏi về giải pháp, hoặc <strong>thử vai khách hàng</strong>: gửi một yêu cầu như khách vẫn nhắn Zalo, QH Copilot sẽ lập phiếu yêu cầu, hỏi lại thông số thiếu và phác phương án từ chính các module Quốc Hưng đang công bố.</p></div>'+
      '<div class="cb-sg">'+DATA.sugg.map(function(g){return "<h6>"+E(g[0])+"</h6><div>"+g[1].map(function(s){return '<button type="button">'+E(s)+"</button>"}).join("")+"</div>"}).join("")+"</div>";
    $$(".cb-sg button",body).forEach(function(b){b.addEventListener("click",function(){ask(b.textContent)})});
  }
  function open(){box.classList.add("open");fab.classList.add("hide");if(!body.innerHTML.trim())greet();setTimeout(function(){if(innerWidth>=760)q.focus()},50)}
  function close(){box.classList.remove("open");fab.classList.remove("hide")}
  fab.addEventListener("click",open);$("#cb-x").addEventListener("click",close);
  box.addEventListener("click",function(e){if(e.target===box)close()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&box.classList.contains("open"))close()});
  $("#cb-wide").addEventListener("click",function(){box.classList.toggle("wide")});
  $("#cb-new").addEventListener("click",function(){if(busy)return;hist=[];greet()});
  q.addEventListener("input",function(){q.style.height="auto";q.style.height=Math.min(q.scrollHeight,140)+"px"});
  q.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(q.value)}});
  send.addEventListener("click",function(){ask(q.value)});
  body.addEventListener("click",function(e){
    var c=e.target.closest("button.cite");if(!c)return;
    if(innerWidth<760)close();
    if(c.dataset.page){FLIP.go(+c.dataset.page);return}
    if(c.dataset.ks){var s=document.getElementById("ks-"+c.dataset.ks.charAt(0).toUpperCase());if(s){s.open=true;s.scrollIntoView({behavior:"smooth",block:"start"})}}
  });
  var sel=document.createElement("button");sel.className="selask";sel.type="button";sel.textContent="Hỏi QH Copilot đoạn này";document.body.appendChild(sel);
  var selText="";
  document.addEventListener("mouseup",function(e){if(e.target===sel)return;setTimeout(function(){var s=window.getSelection(),t=s?String(s).trim():"";
    if(t.length<12||t.length>600||!s.rangeCount||!s.anchorNode||!$("main").contains(s.anchorNode)||$("#sv-form").contains(s.anchorNode)){sel.classList.remove("on");return}
    var r=s.getRangeAt(0).getBoundingClientRect();selText=t;sel.style.left=Math.max(8,Math.min(r.left+scrollX,scrollX+innerWidth-200))+"px";sel.style.top=(r.bottom+scrollY+8)+"px";sel.classList.add("on")},10)});
  sel.addEventListener("click",function(){sel.classList.remove("on");open();ask("Giải thích giúp đoạn này và vì sao nó quan trọng với Quốc Hưng: \""+selText.slice(0,500)+"\"")});
  function addMsg(cls,html){var d=document.createElement("div");d.className="cb-msg "+cls;d.innerHTML=html;body.appendChild(d);return d}
  function scrollEnd(){body.scrollTop=body.scrollHeight}
  async function stream(payload,onDelta,onThink){
    var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},120000);
    try{
      var r=await fetch(API+"/chat",{method:"POST",headers:{"Content-Type":"application/json","X-QH-Key":QHKEY},body:JSON.stringify(payload),signal:ctl.signal});
      if(!r.ok){var j=await r.json().catch(function(){return{}});var er=new Error(j.message||("HTTP "+r.status));er.http=r.status;throw er}
      var rd=r.body.getReader(),dec=new TextDecoder(),buf="",got=false;
      for(;;){var x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});var parts=buf.split("\n\n");buf=parts.pop();
        parts.forEach(function(p){var m=p.match(/^data:\s*(.*)$/m);if(!m)return;try{var d=JSON.parse(m[1]);if(d.t==="c"){got=true;onDelta(d.v)}else if(d.t==="r")onThink()}catch(e){}})}
      if(!got)throw new Error("empty");
    }finally{clearTimeout(to)}
  }
  async function ask(text){
    text=String(text||"").trim();if(text.length<2||busy)return;
    busy=true;send.disabled=true;q.value="";q.style.height="auto";
    $$(".cb-sg,.cb-fu",body).forEach(function(x){x.remove()});
    addMsg("me",E(text));hist.push({role:"user",content:text});
    var t0=Date.now();
    var ph=addMsg("ai",'<div class="cb-think"><span><i></i><i></i><i></i></span><span class="st">QH Copilot đang đọc tri thức Quốc Hưng...</span></div>');scrollEnd();
    var acc="",raf=0,started=false,ok=false,lastErr=null;
    function paint(){raf=0;var sp=splitFollow(acc);ph.innerHTML=md(sp.text);if(body.scrollHeight-body.scrollTop-body.clientHeight<160)scrollEnd()}
    try{await stream({messages:hist.slice(-10),deep:deep.checked},function(v){acc+=v;started=true;if(!raf)raf=requestAnimationFrame(paint)},function(){var s=$(".st",ph);if(s)s.textContent="QH Copilot đang phân tích..."});ok=true}
    catch(e){lastErr=e}
    if(raf){cancelAnimationFrame(raf);raf=0}
    var sp=splitFollow(acc);
    if(ok||started){
      hist.push({role:"assistant",content:acc});
      ph.innerHTML=md(sp.text)+'<div class="cb-tools"><button type="button" class="cp">Chép câu trả lời</button><span class="badge">'+Math.round((Date.now()-t0)/100)/10+" giây</span></div>";
      $(".cp",ph).addEventListener("click",function(){var b=this;navigator.clipboard.writeText(sp.text.replace(/\[(dx|ks|web|qh|lz):[^\]]+\]/g,"")).then(function(){b.textContent="Đã chép"})});
      if(sp.fu.length){var f=document.createElement("div");f.className="cb-fu";f.innerHTML=sp.fu.map(function(x){return '<button type="button">'+E(x)+"</button>"}).join("");body.appendChild(f);
        $$("button",f).forEach(function(b){b.addEventListener("click",function(){ask(b.textContent)})})}
    }else{
      hist.pop();
      var msg=lastErr&&(lastErr.http===429||lastErr.http===401)?lastErr.message:null, off=msg?null:offline(text);
      ph.innerHTML=msg?"<p>"+E(msg)+"</p>":(off?md(off)+'<div class="cb-tools"><span class="badge">Trả lời ngoại tuyến</span></div>':"<p>QH Copilot chưa kết nối được máy chủ AI. Anh/chị vui lòng thử lại sau ít phút.</p>");
    }
    scrollEnd();busy=false;send.disabled=false;
  }
  return {open:open,ask:ask};
}
})();
